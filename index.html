<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>고교선택 적성검사(생기부추월차선)</title>
<meta property="og:title" content="고교선택 적성검사(생기부추월차선)" />
<meta property="og:description" content="내 아이의 성향에 맞는 고교 유형을 찾아드립니다." />
<meta property="og:type" content="website" />
<meta name="twitter:card" content="summary" />
<meta name="twitter:title" content="고교선택 적성검사(생기부추월차선)" />
<style>
/* ===== Design Tokens ===== */
:root {
  --ink: #0E2A3D;
  --ink-soft: #2A4A60;
  --paper: #FAFAF6;
  --paper-2: #F1F5F4;
  --line: #D7DDDC;
  --teal: #0E8F86;
  --teal-deep: #0A6E66;
  --teal-soft: #E3F1EF;
  --amber: #C98A2B;
  --amber-soft: #FBF1DD;
  --rose: #B14A5A;
  --rose-soft: #F7E3E6;
  --good: #2D7A4F;
  --warn: #B14A5A;
  --shadow-sm: 0 1px 2px rgba(14,42,61,.06), 0 1px 1px rgba(14,42,61,.04);
  --shadow-md: 0 4px 12px rgba(14,42,61,.08), 0 2px 4px rgba(14,42,61,.04);
  --shadow-lg: 0 18px 40px rgba(14,42,61,.12), 0 6px 14px rgba(14,42,61,.06);
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 22px;
  --font-display: "Noto Serif KR", "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", serif;
  --font-body: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-body);
  background: var(--paper);
  color: var(--ink);
  line-height: 1.55;
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  min-height: 100vh;
  background-image:
    radial-gradient(ellipse at top right, rgba(14,143,134,.05), transparent 40%),
    radial-gradient(ellipse at bottom left, rgba(201,138,43,.04), transparent 40%);
}

/* ===== Layout ===== */
.shell {
  max-width: 760px;
  margin: 0 auto;
  padding: 0 18px 80px;
  position: relative;
}

header.top {
  padding: 22px 0 14px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
header.top .brand {
  display: flex;
  align-items: center;
  gap: 10px;
}
.logo-mark {
  width: 36px; height: 36px;
  border-radius: 9px;
  background: linear-gradient(135deg, var(--teal) 0%, var(--teal-deep) 100%);
  display: grid;
  place-items: center;
  color: white;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 17px;
  letter-spacing: -.5px;
  box-shadow: var(--shadow-sm);
}
.brand-text {
  display: flex; flex-direction: column; line-height: 1.15;
}
.brand-text strong {
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -.3px;
}
.brand-text span {
  font-size: 11px;
  color: var(--ink-soft);
  letter-spacing: .5px;
}

.admin-key {
  font-size: 11px;
  color: var(--ink-soft);
  background: var(--paper-2);
  border: 1px solid var(--line);
  padding: 6px 10px;
  border-radius: 999px;
  cursor: pointer;
  font-family: var(--font-body);
  transition: all .15s;
}
.admin-key:hover { background: white; border-color: var(--teal); color: var(--teal-deep); }

/* ===== Headings ===== */
h1, h2, h3, h4 { font-family: var(--font-display); letter-spacing: -.5px; margin: 0; }
h1 { font-size: 28px; font-weight: 700; line-height: 1.25; }
h2 { font-size: 22px; font-weight: 700; line-height: 1.3; margin-bottom: 6px; }
h3 { font-size: 17px; font-weight: 700; line-height: 1.35; }
.eyebrow {
  font-size: 12px;
  letter-spacing: 2px;
  color: var(--teal-deep);
  font-weight: 600;
  text-transform: uppercase;
  margin-bottom: 10px;
}
.lede {
  font-size: 16px;
  color: var(--ink-soft);
  line-height: 1.65;
  margin: 12px 0 0;
}

/* ===== Cards ===== */
.card {
  background: white;
  border-radius: var(--radius-lg);
  padding: 28px 24px;
  box-shadow: var(--shadow-md);
  border: 1px solid var(--line);
  margin-bottom: 16px;
}
.card.flat {
  background: var(--paper-2);
  box-shadow: none;
  border: 1px dashed var(--line);
}
.card.tinted {
  background: var(--teal-soft);
  border-color: rgba(14,143,134,.2);
}

/* ===== Buttons ===== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-family: var(--font-body);
  font-size: 16px;
  font-weight: 600;
  padding: 14px 22px;
  border-radius: 999px;
  border: 1px solid transparent;
  cursor: pointer;
  transition: all .18s cubic-bezier(.2,.7,.3,1);
  text-decoration: none;
  letter-spacing: -.2px;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.btn-primary {
  background: var(--ink);
  color: white;
}
.btn-primary:hover { background: var(--teal-deep); transform: translateY(-1px); }
.btn-primary:active { transform: translateY(0); }
.btn-primary:disabled {
  background: var(--line); color: var(--ink-soft); cursor: not-allowed; transform: none;
}
.btn-ghost {
  background: transparent;
  color: var(--ink);
  border-color: var(--line);
}
.btn-ghost:hover { background: var(--paper-2); border-color: var(--ink-soft); }
.btn-block { width: 100%; }
.btn-sm { padding: 9px 14px; font-size: 14px; }

/* ===== Form fields ===== */
.field { margin-bottom: 16px; }
.field label {
  display: block;
  font-size: 13px;
  color: var(--ink-soft);
  margin-bottom: 7px;
  font-weight: 500;
}
.field input, .field select {
  width: 100%;
  padding: 13px 15px;
  font-size: 16px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: white;
  font-family: var(--font-body);
  color: var(--ink);
  transition: border-color .15s;
}
.field input:focus, .field select:focus {
  outline: none;
  border-color: var(--teal);
  box-shadow: 0 0 0 3px var(--teal-soft);
}

/* ===== Welcome screen ===== */
.hero-decor {
  position: relative;
  padding: 32px 24px 28px;
}
.hero-decor::before {
  content: '';
  position: absolute;
  top: 18px; right: 18px;
  width: 72px; height: 72px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, var(--amber-soft), var(--amber) 80%);
  opacity: .35;
  filter: blur(2px);
}
.hero-decor h1 { position: relative; z-index: 1; }

.feature-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px;
  margin-top: 18px;
}
.feature {
  padding: 14px 13px;
  background: var(--paper-2);
  border-radius: var(--radius-sm);
  font-size: 13px;
  line-height: 1.45;
}
.feature strong {
  display: block;
  font-size: 13px;
  margin-bottom: 3px;
  color: var(--teal-deep);
}

/* ===== Progress ===== */
.progress-shell {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--paper);
  padding: 12px 0 14px;
  margin: -22px -18px 16px;
  padding-left: 18px;
  padding-right: 18px;
  border-bottom: 1px solid var(--line);
}
.progress-meta {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 12px; color: var(--ink-soft);
  margin-bottom: 8px;
  letter-spacing: .3px;
}
.progress-meta strong { color: var(--ink); font-weight: 600; }
.progress-bar {
  height: 6px;
  background: var(--line);
  border-radius: 999px;
  overflow: hidden;
  position: relative;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--teal), var(--teal-deep));
  border-radius: 999px;
  transition: width .35s cubic-bezier(.2,.7,.3,1);
  width: 0%;
}

/* ===== Question ===== */
.q-axis-tag {
  display: inline-block;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1px;
  color: var(--teal-deep);
  background: var(--teal-soft);
  padding: 4px 10px;
  border-radius: 999px;
  margin-bottom: 14px;
  text-transform: uppercase;
}
.q-text {
  font-family: var(--font-display);
  font-size: 21px;
  font-weight: 600;
  line-height: 1.4;
  letter-spacing: -.5px;
  color: var(--ink);
  margin: 0 0 24px;
}
.q-hint {
  font-size: 13px;
  color: var(--ink-soft);
  margin: -16px 0 22px;
  line-height: 1.5;
  padding: 10px 12px;
  background: var(--amber-soft);
  border-radius: var(--radius-sm);
  border-left: 3px solid var(--amber);
}

/* Likert scale */
.likert {
  display: flex;
  gap: 8px;
  margin-bottom: 8px;
}
.likert-opt {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 16px 6px 12px;
  border: 1.5px solid var(--line);
  border-radius: var(--radius-md);
  cursor: pointer;
  background: white;
  transition: all .15s;
  text-align: center;
}
.likert-opt:hover { border-color: var(--teal); }
.likert-opt input { display: none; }
.likert-opt .dot {
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--paper-2);
  border: 2px solid var(--line);
  transition: all .15s;
}
.likert-opt span {
  font-size: 11px;
  color: var(--ink-soft);
  line-height: 1.2;
  font-weight: 500;
}
.likert-opt.selected {
  border-color: var(--teal);
  background: var(--teal-soft);
}
.likert-opt.selected .dot {
  background: var(--teal);
  border-color: var(--teal);
  box-shadow: 0 0 0 3px white inset;
}
.likert-opt.selected span { color: var(--teal-deep); font-weight: 600; }

.likert-axis-labels {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--ink-soft);
  margin-top: 10px;
  padding: 0 4px;
}

/* Single-choice list (G1 학력 위치, G3 영어 수준) — 세로 배열 */
.choice-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 6px;
}
.choice-opt {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  border: 1.5px solid var(--line);
  border-radius: var(--radius-md);
  cursor: pointer;
  background: white;
  transition: all .15s;
}
.choice-opt:hover { border-color: var(--teal); }
.choice-opt .dot {
  width: 20px; height: 20px;
  border-radius: 50%;
  background: var(--paper-2);
  border: 2px solid var(--line);
  flex-shrink: 0;
  transition: all .15s;
}
.choice-opt span {
  font-size: 15px;
  color: var(--ink);
  line-height: 1.4;
  font-weight: 500;
}
.choice-opt.selected {
  border-color: var(--teal);
  background: var(--teal-soft);
}
.choice-opt.selected .dot {
  background: var(--teal);
  border-color: var(--teal);
  box-shadow: 0 0 0 4px white inset;
}
.choice-opt.selected span { color: var(--teal-deep); font-weight: 600; }

/* 컨설팅 메모 — 결과 화면 */
.memo-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
}
.memo-row {
  display: flex;
  gap: 12px;
  padding: 12px 14px;
  background: var(--paper-2);
  border-radius: var(--radius-sm);
  align-items: center;
}
.memo-lbl {
  flex: 0 0 96px;
  font-size: 12px;
  letter-spacing: .5px;
  color: var(--ink-soft);
  font-weight: 600;
  text-transform: uppercase;
}
.memo-val {
  flex: 1;
  font-size: 14px;
  color: var(--ink);
  font-weight: 500;
}
.memo-ft {
  margin-bottom: 12px;
  padding: 12px 14px;
  background: var(--paper-2);
  border-radius: var(--radius-sm);
  border-left: 3px solid var(--teal);
}
.memo-ft:last-child { margin-bottom: 0; }
.memo-ft-lbl {
  font-size: 12px;
  letter-spacing: .5px;
  color: var(--teal-deep);
  font-weight: 600;
  margin-bottom: 6px;
}
.memo-ft-val {
  font-size: 14px;
  color: var(--ink);
  line-height: 1.55;
  white-space: pre-wrap;
  word-break: break-word;
}

/* Multi-select (계열) */
.ms-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
  margin-bottom: 6px;
}
.ms-card {
  border: 1.5px solid var(--line);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  cursor: pointer;
  background: white;
  transition: all .15s;
}
.ms-card:hover { border-color: var(--teal); }
.ms-card.selected {
  border-color: var(--teal);
  background: var(--teal-soft);
}
.ms-card-head {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 6px;
}
.ms-card-head strong {
  font-family: var(--font-display);
  font-size: 16px;
}
.ms-check {
  width: 22px; height: 22px;
  border: 2px solid var(--line);
  border-radius: 6px;
  display: grid; place-items: center;
  flex-shrink: 0;
}
.ms-card.selected .ms-check {
  background: var(--teal);
  border-color: var(--teal);
  color: white;
}
.ms-card.selected .ms-check::after {
  content: '✓';
  font-size: 14px;
  font-weight: 700;
}
.ms-card .col { font-size: 13px; color: var(--ink-soft); line-height: 1.5; }
.ms-card .col em { font-style: normal; color: var(--ink); font-weight: 500; }
.ms-card.unsure {
  background: var(--amber-soft);
  border-color: rgba(201,138,43,.4);
}
.ms-card.unsure.selected {
  border-color: var(--amber);
  background: var(--amber-soft);
}
.ms-card.unsure.selected .ms-check {
  background: var(--amber); border-color: var(--amber);
}

/* ===== Nav ===== */
.q-nav {
  display: flex;
  gap: 10px;
  margin-top: 22px;
}
.q-nav .btn { flex: 1; }

/* ===== Result ===== */
.cap-alert {
  display: flex;
  gap: 14px;
  align-items: flex-start;
  padding: 18px 18px;
  border-radius: var(--radius-lg);
  margin-bottom: 14px;
  border: 1.5px solid;
}
.cap-alert.severe {
  background: var(--rose-soft);
  border-color: var(--rose);
  color: var(--ink);
}
.cap-alert.moderate {
  background: var(--amber-soft);
  border-color: var(--amber);
  color: var(--ink);
}
.cap-alert.info {
  background: var(--teal-soft);
  border-color: var(--teal);
  color: var(--ink);
}
.cap-alert .cap-icon {
  flex-shrink: 0;
  width: 36px; height: 36px;
  border-radius: 50%;
  display: grid; place-items: center;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 18px;
  color: white;
}
.cap-alert.severe .cap-icon { background: var(--rose); }
.cap-alert.moderate .cap-icon { background: var(--amber); }
.cap-alert.info .cap-icon { background: var(--teal); }
.cap-alert .cap-body strong {
  display: block;
  font-family: var(--font-display);
  font-size: 16px;
  margin-bottom: 4px;
}
.cap-alert.severe .cap-body strong { color: var(--rose); }
.cap-alert.moderate .cap-body strong { color: #8C5A0F; }
.cap-alert.info .cap-body strong { color: var(--teal-deep); }
.cap-alert .cap-body p {
  margin: 0;
  font-size: 13.5px;
  line-height: 1.55;
  color: var(--ink-soft);
}
.cap-alert .cap-body p strong { display: inline; font-size: inherit; color: var(--ink); margin: 0; }

.result-hero {
  padding: 32px 24px;
  text-align: center;
  background: linear-gradient(135deg, var(--ink) 0%, var(--teal-deep) 100%);
  color: white;
  border-radius: var(--radius-lg);
  margin-bottom: 16px;
  position: relative;
  overflow: hidden;
}
.result-hero::after {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 20% 0%, rgba(255,255,255,.08), transparent 50%),
    radial-gradient(circle at 80% 100%, rgba(201,138,43,.15), transparent 50%);
  pointer-events: none;
}
.result-hero h1 {
  color: white;
  font-size: 24px;
  position: relative;
}
.result-hero .sub {
  color: rgba(255,255,255,.75);
  font-size: 14px;
  margin-top: 6px;
  position: relative;
}
.result-hero .top-tag {
  display: inline-block;
  font-size: 11px;
  letter-spacing: 2px;
  color: rgba(255,255,255,.7);
  background: rgba(255,255,255,.1);
  padding: 5px 12px;
  border-radius: 999px;
  margin-bottom: 14px;
  position: relative;
}

/* Hexagon chart */
.hex-wrap {
  display: flex;
  justify-content: center;
  margin: 14px 0 6px;
}
.hex-wrap svg { max-width: 100%; height: auto; }

/* Rank list */
.rank-item {
  display: flex; align-items: center; gap: 14px;
  padding: 18px 16px;
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  margin-bottom: 10px;
  background: white;
}
.rank-item.r1 {
  border-color: var(--teal);
  background: var(--teal-soft);
  border-width: 2px;
}
.rank-item.r2 {
  border-color: var(--amber);
  background: var(--amber-soft);
}
.rank-num {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--ink);
  color: white;
  display: grid; place-items: center;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 16px;
  flex-shrink: 0;
}
.rank-item.r1 .rank-num { background: var(--teal); }
.rank-item.r2 .rank-num { background: var(--amber); }
.rank-body { flex: 1; min-width: 0; }
.rank-body strong {
  display: block;
  font-family: var(--font-display);
  font-size: 17px;
  margin-bottom: 2px;
}
.rank-body .why {
  font-size: 13px;
  color: var(--ink-soft);
  line-height: 1.45;
}
.rank-score {
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 700;
  color: var(--ink-soft);
  flex-shrink: 0;
}
.rank-item.r1 .rank-score { color: var(--teal-deep); }

/* Mental type card */
.mental-card {
  padding: 24px 20px;
  border-radius: var(--radius-lg);
  background: linear-gradient(135deg, var(--paper-2), white);
  border: 1px solid var(--line);
  margin-bottom: 16px;
}
.mental-icon {
  display: inline-grid;
  place-items: center;
  width: 56px; height: 56px;
  border-radius: 16px;
  background: var(--teal-soft);
  color: var(--teal-deep);
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 800;
  margin-bottom: 12px;
}

/* Bars */
.bar-row {
  display: grid;
  grid-template-columns: 90px 1fr 40px;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
  font-size: 13px;
}
.bar-row .label { color: var(--ink-soft); font-weight: 500; }
.bar-row .num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; color: var(--ink); }
.bar-track {
  height: 8px;
  background: var(--paper-2);
  border-radius: 999px;
  overflow: hidden;
  position: relative;
}
.bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--teal), var(--teal-deep));
  border-radius: 999px;
  transition: width .8s cubic-bezier(.2,.7,.3,1);
}
.bar-fill.amber { background: linear-gradient(90deg, var(--amber), #A16910); }
.bar-fill.rose { background: linear-gradient(90deg, var(--rose), #8C3441); }

/* Section header */
.section-h {
  display: flex; align-items: baseline; gap: 8px;
  margin: 24px 0 12px;
  padding-left: 4px;
}
.section-h h2 { margin: 0; }
.section-h .num {
  font-family: var(--font-display);
  font-size: 12px;
  color: var(--teal-deep);
  font-weight: 600;
  letter-spacing: 2px;
}

/* ===== Admin panel ===== */
.admin-shell {
  background: var(--ink);
  color: white;
  min-height: 100vh;
  padding: 22px 18px 60px;
}
.admin-top {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 22px;
  padding-bottom: 16px;
  border-bottom: 1px solid rgba(255,255,255,.12);
}
.admin-top h1 { color: white; font-size: 20px; }

}

/* 토큰 게이트 화면 */
.gate-card { padding: 32px 28px; }

// 멘탈 유형(F축 5요인) 매핑 → 고교 유형 추가 가중치
// ★ 정서적 안정성(N)을 가장 결정적 변수로. 멘탈 약하면 강도 높은 학교 모두 페널티.
function mentalTypeBonus(big5) {
  // big5 = {N, E, C, O, A} 각 0~100
  const bonus = {'일반고':0, '자공고2.0':0, '자사고':0, '외고':0, '국제고':0, '과학고':0, '영재학교':0};

  // 정서적 안정성(N) — 가장 결정적. 회복형은 강도 높은 학교 모두 부적합.
  if (big5.N < 35) {
    // 매우 낮음: 강한 회복 우선
    bonus['일반고']    += 2.5;
    bonus['자공고2.0'] += 2.8;
    bonus['자사고']    -= 4.0;
    bonus['외고']      -= 3.5;
    bonus['국제고']    -= 3.5;
    bonus['과학고']    -= 3.5;
    bonus['영재학교']  -= 4.5;
  } else if (big5.N < 50) {
    // 중하: ★ 사용자 케이스. 외고/국제고/자사고/특목 모두 부적합 신호.
    bonus['일반고']    += 1.8;
    bonus['자공고2.0'] += 2.0;
    bonus['자사고']    -= 2.8;
    bonus['외고']      -= 2.3;
    bonus['국제고']    -= 2.3;
    bonus['과학고']    -= 2.3;
    bonus['영재학교']  -= 3.0;
  } else if (big5.N < 60) {
    // 평균: 약간의 보정만
    bonus['일반고']    += 0.4;
    bonus['자공고2.0'] += 0.4;
    bonus['자사고']    -= 0.5;
    bonus['영재학교']  -= 0.7;
  } else if (big5.N >= 75) {
    // 매우 높음: 강철 멘탈
    bonus['자사고']    += 1.0;
    bonus['영재학교']  += 1.0;
    bonus['과학고']    += 1.0;
    bonus['외고']      += 0.5;
    bonus['국제고']    += 0.5;
  }
  // 외향성(E) — 높으면 다양한 또래 환경에서 강점
  if (big5.E >= 65) {
    bonus['외고']     += 0.8;
    bonus['국제고']   += 0.8;
    bonus['자사고']   += 0.4;
  } else if (big5.E < 35) {
    bonus['일반고']   += 0.4;
    bonus['자공고2.0']+= 0.4;
    bonus['과학고']   += 0.5;  // 내향+탐구 친화
  }
  // 성실성(C) — 높으면 거의 모든 학교에 +
  if (big5.C >= 65) {
    bonus['자사고']   += 0.6;
    bonus['과학고']   += 0.7;
    bonus['영재학교'] += 0.7;
    bonus['외고']     += 0.4;
    bonus['국제고']   += 0.4;
  } else if (big5.C < 40) {
    bonus['자사고']   -= 0.8;
    bonus['과학고']   -= 0.8;
    bonus['영재학교'] -= 0.8;
    bonus['일반고']   += 0.5;
    bonus['자공고2.0']+= 0.7;
  }
  // 개방성(O) — 높으면 도전·다양성 환경
  if (big5.O >= 65) {
    bonus['외고']     += 0.5;
    bonus['국제고']   += 0.6;
    bonus['영재학교'] += 0.5;
  }
  // 우호성(A) — 높으면 협력적 환경, 낮으면 경쟁환경 가능
  if (big5.A < 40) {
    bonus['자사고']   += 0.3;
    bonus['영재학교'] += 0.3;
  }
  return bonus;
}

// ============================================================
// 점수 계산 메인 함수
// ============================================================
function computeScores(answers, careerSelections, background) {
  background = background || {};
  // 1. 축별 점수 (0-100 정규화) — A~F만 점수 산출, G/H는 정보용
  const axes = {A:[], B:[], C:[], D:[], E:[], F:[]};
  const axisDetail = {};

  QUESTIONS.forEach(q => {
    if (q.type === 'multi-career') return;
    if (q.axis === 'G' || q.axis === 'H') return; // 배경/자유서술은 점수 산출 제외
    const ans = answers[q.id];
    if (ans == null) return;
    let val = ans;
    if (q.reverse) val = 6 - val; // 역문항
    axes[q.axis].push(val);
    if (!axisDetail[q.axis]) axisDetail[q.axis] = [];
    axisDetail[q.axis].push({ id: q.id, sub: q.sub, val });
  });

  const axisScore = {};
  Object.keys(axes).forEach(k => {
    if (axes[k].length === 0) { axisScore[k] = 50; return; }
    const avg = axes[k].reduce((a,b)=>a+b,0) / axes[k].length;  // 1-5
    axisScore[k] = Math.round(((avg - 1) / 4) * 100);            // 0-100
  });

  // 2. 멘탈 유형 (F축 하위 — 5요인 별도 점수)
  const big5 = {N:50, E:50, C:50, O:50, A:50};
  ['N','E','C','O','A'].forEach(sub => {
    const items = (axisDetail.F || []).filter(it => it.sub === sub);
    if (items.length === 0) return;
    const avg = items.reduce((a,b)=>a+b.val,0) / items.length;
    big5[sub] = Math.round(((avg - 1) / 4) * 100);
  });
  const mental = classifyMentalType(big5);

  // 3. 7개 고교 유형별 적합도 점수
  const typeScores = {};
  Object.keys(HS_TYPES).forEach(t => typeScores[t] = 0);

  // (a) 축 점수 × 가중치
  Object.keys(AXIS_TYPE_WEIGHTS).forEach(ax => {
    const score = axisScore[ax] || 50;
    // 50을 기준으로 하여 +-50 범위 → -1.0 ~ +1.0 normalized
    const norm = (score - 50) / 50;
    Object.keys(AXIS_TYPE_WEIGHTS[ax]).forEach(t => {
      typeScores[t] += norm * AXIS_TYPE_WEIGHTS[ax][t] * 10;
    });
  });

  // (b) 계열 선택 보너스
  const careerHasUnsure = careerSelections.includes('unsure');
  const realCareers = careerSelections.filter(id => id !== 'unsure');

  if (careerHasUnsure || realCareers.length === 0) {
    // 잘 모르겠다 → 탐색 친화적 학교 가산
    typeScores['일반고'] += 4;
    typeScores['자공고2.0'] += 4;
    typeScores['자사고'] -= 2;
    typeScores['외고'] -= 1.5;
    typeScores['국제고'] -= 1.5;
    typeScores['과학고'] -= 2;
    typeScores['영재학교'] -= 2;
  } else {
    // 선택한 계열들의 가중 평균 적용
    const trackWeights = {eng:0, hum:0, soc:0, lang:0, intl:0};
    realCareers.forEach(careerId => {
      const c = CAREER_TRACKS.find(x => x.id === careerId);
      if (!c) return;
      Object.keys(c.tracks).forEach(t => {
        trackWeights[t] += c.tracks[t];
      });
    });
    // 정규화 (선택 개수로 나눔)
    const totalWeight = Object.values(trackWeights).reduce((a,b)=>a+b,0) || 1;
    Object.keys(trackWeights).forEach(t => {
      const w = trackWeights[t] / totalWeight;
      const bonus = TRACK_TYPE_BONUS[t];
      if (!bonus) return;
      Object.keys(bonus).forEach(hs => {
        typeScores[hs] += w * bonus[hs] * 4;
      });
    });
  }

  // (c) 멘탈 유형 보너스
  const mentalBonus = mentalTypeBonus(big5);
  Object.keys(mentalBonus).forEach(t => typeScores[t] += mentalBonus[t]);

  // (d) 0-100 스케일로 변환
  // 모든 점수를 50을 기준으로 옮긴 뒤 양수로 만들기
  const finalScores = {};
  Object.keys(typeScores).forEach(t => {
    finalScores[t] = Math.max(0, Math.min(100, Math.round(50 + typeScores[t] * 1.5)));
  });

  // (e) ★ 멘탈 보호 후처리: 정서적 안정성이 낮으면 특목고 점수에 절대 cap 적용
  // 단순 가중치만으로는 다른 축이 매우 높을 때 특목고가 다시 상위로 올라올 위험이 있음.
  // 멘탈 약 → 특목고는 환경 자체가 회복을 막을 수 있어 사실상 추천에서 배제.
  const SPECIAL_TYPES = ['자사고', '외고', '국제고', '과학고', '영재학교'];
  let mentalCap = null;
  if (big5.N < 35) {
    SPECIAL_TYPES.forEach(t => { finalScores[t] = Math.min(finalScores[t], 30); });
    mentalCap = 'severe';
  } else if (big5.N < 50) {
    SPECIAL_TYPES.forEach(t => { finalScores[t] = Math.min(finalScores[t], 50); });
    mentalCap = 'moderate';
  }

  // (g) ★ 학력 cap (v2.1 신규): 객관적 학력 위치가 따라주지 않으면 특목/자사고 추천 부적절.
  // 컨설팅장에서 "저희 아이가 그 정도가 안 되는데요" 반응을 구조적으로 막는 안전장치.
  // unknown은 cap을 발동하지 않되 결과 화면에 안내 1줄만 표시.
  const HIGH_TIER = ['자사고', '과학고', '영재학교'];
  let academicCap = null;
  const academicRank = background.academicRank;
  if (academicRank === 'below50') {
    SPECIAL_TYPES.forEach(t => { finalScores[t] = Math.min(finalScores[t], 35); });
    academicCap = 'severe';
  } else if (academicRank === 'top50') {
    HIGH_TIER.forEach(t => { finalScores[t] = Math.min(finalScores[t], 55); });
    academicCap = 'moderate';
  } else if (!academicRank || academicRank === 'unknown') {
    academicCap = 'unknown';
  }

  // (f) ★ 계열 fit cap: 명확한 계열을 골랐는데 학교 특화 분야와 안 맞으면 자동 후순위
  // 외고는 외국어, 국제고는 국제, 과학고/영재학교는 이공 특화학교.
  // 이 계열을 안 골랐다면 그 특목고는 추천 대상에서 자연스럽게 빠져야 한다.
  const careerCapList = [];
  if (!careerHasUnsure && realCareers.length > 0) {
    const trackFlags = { eng: false, lang: false, intl: false };
    realCareers.forEach(id => {
      const c = CAREER_TRACKS.find(x => x.id === id);
      if (!c || !c.tracks) return;
      if (c.tracks.eng)  trackFlags.eng  = true;
      if (c.tracks.lang) trackFlags.lang = true;
      if (c.tracks.intl) trackFlags.intl = true;
    });
    // 외국어 계열 미선택 → 외고 cap 60
    if (!trackFlags.lang) {
      finalScores['외고'] = Math.min(finalScores['외고'], 60);
      careerCapList.push('외고');
    }
    // 국제·외국어 둘 다 미선택 → 국제고 cap 60
    if (!trackFlags.intl && !trackFlags.lang) {
      finalScores['국제고'] = Math.min(finalScores['국제고'], 60);
      careerCapList.push('국제고');
    }
    // 이공 계열 미선택 → 과학고/영재학교 cap 55
    if (!trackFlags.eng) {
      finalScores['과학고']   = Math.min(finalScores['과학고'], 55);
      finalScores['영재학교'] = Math.min(finalScores['영재학교'], 55);
      careerCapList.push('과학고', '영재학교');
    }
  }

  // 4. 추천 순위
  const ranking = Object.entries(finalScores)
    .sort((a, b) => b[1] - a[1])
    .map(([type, score]) => ({ type, score }));

  return {
    axisScore,
    big5,
    mental,
    typeScores: finalScores,
    ranking,
    careerSelections,
    background,
    mentalCap,
    academicCap,
    careerCapList
  };
}

function buildRationale(rank, scores) {
  const t = rank.type;
  const reasons = [];
  const ax = scores.axisScore;
  const m = scores.mental;
  const careers = scores.careerSelections;
  const hasUnsure = careers.includes('unsure') || careers.length === 0;
  const SPECIAL = ['자사고', '외고', '국제고', '과학고', '영재학교'];

  // ★ 멘탈 cap 발동 시: 특목고는 추천 사유 자체가 "권하지 않는다"
  if (scores.mentalCap && SPECIAL.includes(t)) {
    if (scores.mentalCap === 'severe') {
      return '정서적 안정성이 평균보다 많이 낮아 회복이 최우선입니다. 강도 높은 학교는 환경 자체가 위험 요인이 될 수 있어 권장하지 않아요.';
    }
    return '정서적 안정성이 평균 이하라 멘탈 보호가 우선입니다. 다른 조건이 좋아도 강도 높은 환경은 적응 부담이 클 수 있어 후순위로 두었어요.';
  }
  // ★ 학력 cap 발동 시: 특목/상위 학교는 학력 우선 보강이 먼저
  const HIGH_TIER = ['자사고', '과학고', '영재학교'];
  if (scores.academicCap === 'severe' && SPECIAL.includes(t)) {
    return '현재 학교 시험 위치로는 합격·적응 모두 부담이 큽니다. 컨설팅에서 학습 로드맵을 먼저 점검해 보세요.';
  }
  if (scores.academicCap === 'moderate' && HIGH_TIER.includes(t)) {
    return '성적이 빠르게 올라오는 중이라면 후반에 다시 검토할 수 있어요. 지금 시점에선 후순위로 두었습니다.';
  }
  // ★ 멘탈 cap 발동 시: 일반고/자공고가 상위로 올라온 이유
  if (scores.mentalCap && (t === '일반고' || t === '자공고2.0')) {
    if (scores.mentalCap === 'severe') {
      reasons.push('정서적 안정성 회복이 최우선이라, 안정적인 학교 환경이 가장 중요한 조건이에요.');
    } else {
      reasons.push('멘탈이 평균 이하라 강도 높은 학교보다 안정적인 환경이 더 중요해요.');
    }
  }
  // ★ 학력 cap 발동 시: 일반고/자공고가 상위로 올라온 이유
  if (scores.academicCap === 'severe' && (t === '일반고' || t === '자공고2.0')) {
    reasons.push('지금 학력 위치 기준으로 가장 안정적인 선택지예요. 학습 기반을 다지면서 전형을 준비할 수 있어요.');
  }

  switch(t) {
    case '일반고':
      if (hasUnsure) reasons.push('진로 탐색 단계에 있어 다양한 가능성을 열어두기에 좋아요.');
      if (ax.A < 60) reasons.push('자기주도 학습 체력을 학교 시스템과 함께 차근차근 키울 수 있어요.');
      if (ax.D < 50) reasons.push('통학·비용 부담을 최소화할 수 있는 현실적인 선택입니다.');
      if (m.key === 'protective') reasons.push('감정 회복기에 안정적인 학습 환경을 제공받을 수 있어요.');
      break;
    case '자공고2.0':
      reasons.push('일반고의 안정감과 학점제 선택과목의 폭을 함께 누릴 수 있어요.');
      if (ax.A >= 50 && ax.A < 75) reasons.push('자기주도 학습이 중상위 수준인 학생에게 잘 맞는 절충형이에요.');
      if (m.key === 'planner' || m.key === 'connector') reasons.push('관리받으면서도 다양성을 경험할 수 있는 환경입니다.');
      break;
    case '자사고':
      if (ax.A >= 70) reasons.push('학습량이 많아도 끝까지 소화할 수 있는 학습 체력이 있어요.');
      if (ax.E >= 65) reasons.push('또래 경쟁이 동기부여로 작용하는 유형이에요.');
      if (ax.D >= 60) reasons.push('학비·기숙비를 감당할 수 있는 환경이 준비되어 있어요.');
      if (m.key === 'resilient') reasons.push('압박 속에서도 흔들리지 않는 멘탈을 가지고 있어요.');
      break;
    case '외고':
      if (careers.includes('lang') || careers.includes('hum')) reasons.push('어문·인문 계열 진학에 특화된 환경이에요.');
      if (m.key === 'explorer' || m.key === 'connector') reasons.push('언어와 사람에 대한 호기심이 강한 멘탈 유형과 잘 맞아요.');
      break;
    case '국제고':
      if (careers.includes('intl') || careers.includes('soc')) reasons.push('국제·사회 계열 진학에 가장 적합한 환경입니다.');
      if (ax.B >= 60) reasons.push('진로 방향이 비교적 분명해 학교생활 기록의 일관성을 만들기 좋아요.');
      break;
    case '과학고':
      if (careers.includes('eng')) reasons.push('이공계 진학을 전제로 한 심화 환경에 부합해요.');
      if (ax.A >= 70) reasons.push('이공 심화 학습량을 감당할 학습 체력이 있어요.');
      reasons.push('※ 의대 진학 시 페널티가 있으니 진로 확정 여부를 다시 점검하세요.');
      break;
    case '영재학교':
      if (ax.A >= 80 && (careers.includes('eng'))) reasons.push('이공 심화의 최고 강도 환경에 적성이 매우 잘 맞아요.');
      else reasons.push('전국 최상위 수·과학 영재 대상 학교입니다. 학업 강도를 신중히 점검하세요.');
      break;
  }
  if (reasons.length === 0) {
    reasons.push(`종합 적합도 점수가 ${rank.score}점으로 평가되었습니다.`);
  }
  return reasons.slice(0, 3).join(' ');
}

        <li>새로 검사를 받으시려면 다시 결제하셔야 합니다.</li>

  } else if (status === 'not_found') {

    title = '존재하지 않는 링크입니다';
    body = `
      <p class="lede">받으신 링크를 다시 한 번 확인해 주세요.</p>
      <ul class="gate-list">
        <li>주소창의 링크가 운영자가 보내준 것과 정확히 같은지 확인해 주세요.</li>

  }
  main.innerHTML = `
    <div class="card hero-decor fade-in gate-card gate-${tone}">

      <h1>${title}</h1>

  if (retry) retry.onclick = () => { state.tokenStatus = 'checking'; render(); checkToken(); };
}

// ── 토큰 검증 (peek_token RPC) ─────────────────────────────
async function checkToken() {
  // 클라우드 미설정 = 개발/로컬 모드: 토큰 게이트 우회
  if (!isCloudEnabled()) {
    state.tokenStatus = 'dev_mode';
    render();
    return;
  }
  state.tokenCode = new URLSearchParams(location.search).get('t') || null;
  if (!state.tokenCode) {
    state.tokenStatus = 'no_token';
    render();
    return;
  }
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/peek_token`, {
      method: 'POST',
      headers: _cloudHeaders(),
      body: JSON.stringify({ p_code: state.tokenCode })
    });
    if (!res.ok) throw new Error(`peek failed: ${res.status}`);
    const status = await res.json();
    state.tokenStatus = (status === 'valid' || status === 'already_used' || status === 'not_found')
      ? status
      : 'error';
  } catch (e) {
    console.warn('[Token] peek 실패:', e);
    state.tokenStatus = 'error';
  }
  render();
}

          <button type="button" class="link-btn" id="btnViewPrivacy">전체 개인정보처리방침 보기 →</button>
        </div>
        <label class="consent-row">
          <input type="checkbox" id="fConsent" />
          <span>위 개인정보 수집·이용 안내를 확인하였으며, <strong>미성년자의 보호자로서 자녀의 개인정보 수집·이용에 동의</strong>합니다.</span>
        </label>
      </div>
      <button class="btn btn-primary btn-block" id="btnStart" disabled>검사 시작하기 →</button>
    </div>
  `;
  // 동의 체크박스 + 입력 검증으로 시작 버튼 활성화
  const updateStartButton = () => {
    const name = document.getElementById('fName').value.trim();
    const phoneRaw = document.getElementById('fPhone').value.trim();
    const phoneClean = phoneRaw.replace(/[^0-9]/g, '');
    const phoneOk = /^01[0-9]{8,9}$/.test(phoneClean);
    const grade = document.getElementById('fGrade').value;
    const consent = document.getElementById('fConsent').checked;
    const btn = document.getElementById('btnStart');
    btn.disabled = !(name && phoneOk && grade && consent);
  };
  document.getElementById('fName').oninput = updateStartButton;
  document.getElementById('fPhone').oninput = updateStartButton;
  document.getElementById('fGrade').onchange = updateStartButton;
  document.getElementById('fConsent').onchange = updateStartButton;

  // 개인정보처리방침 전체 보기
  document.getElementById('btnViewPrivacy').onclick = showPrivacyModal;

  document.getElementById('btnStart').onclick = () => {
    state.name = document.getElementById('fName').value.trim();
    const phoneRaw = document.getElementById('fPhone').value.trim();
    const phoneClean = phoneRaw.replace(/[^0-9]/g, '');
    state.grade = document.getElementById('fGrade').value;
    state.school = document.getElementById('fSchool').value.trim();
    const consent = document.getElementById('fConsent').checked;
    if (!state.name || !state.grade) {
      alert('이름과 학년을 입력해 주세요.');
      return;
    }
    if (!/^01[0-9]{8,9}$/.test(phoneClean)) {
      alert('보호자 휴대전화 번호를 010-1234-5678 형식으로 입력해 주세요.');
      return;
    }
    // 11자리 표준 형식으로 정규화 (010-XXXX-XXXX)
    state.phone = phoneClean.length === 11
      ? phoneClean.replace(/^(\d{3})(\d{4})(\d{4})$/, '$1-$2-$3')
      : phoneClean.replace(/^(\d{3})(\d{3})(\d{4})$/, '$1-$2-$3');
    if (!consent) {
      alert('개인정보 수집·이용 동의가 필요합니다.');
      return;
    }
    state.consent = { agreed: true, agreedAt: new Date().toISOString(), version: 'v1' };
    state.view = 'quiz';
    state.questionIdx = 0;
    state.answers = {};
    state.careerSelections = [];
    state.background = {};
    state.freetext = {};
    render();
  };
}

// ── Quiz ───────────────────────────────────────────────────
function renderQuiz() {
  const total = QUESTIONS.length;
  const cur = QUESTIONS[state.questionIdx];
  const pct = Math.round((state.questionIdx / total) * 100);
  const axisName = {A:'학업 성향', B:'진로 명확도', C:'입시 전략', D:'환경·생활', E:'심리·사회성', F:'멘탈 유형', G:'배경 정보', H:'추가로 알려주세요'}[cur.axis];

  let bodyHTML = '';
  if (cur.type === 'multi-career') {
    bodyHTML = `
      <div class="ms-grid">
        ${CAREER_TRACKS.map(c => {
          const sel = state.careerSelections.includes(c.id);
          return `
          <div class="ms-card ${sel ? 'selected' : ''} ${c.isUnsure ? 'unsure' : ''}" data-cid="${c.id}">
            <div class="ms-card-head">
              <strong>${c.name}</strong>
              <div class="ms-check"></div>
            </div>
            <div class="col"><em>${c.majors}</em></div>
            ${c.jobs ? `<div class="col" style="margin-top:4px">${c.jobs}</div>` : ''}
          </div>`;
        }).join('')}
      </div>
    `;
  } else if (cur.type === 'academic-rank') {
    const sel = state.background.academicRank;
    bodyHTML = `
      <div class="choice-list">
        ${cur.choices.map(c => `
          <label class="choice-opt ${sel === c.id ? 'selected' : ''}" data-cid="${c.id}">
            <div class="dot"></div>
            <span>${c.label}</span>
          </label>
        `).join('')}
      </div>
    `;
  } else if (cur.type === 'english-level') {
    const sel = state.background.englishLevel;
    bodyHTML = `
      <div class="choice-list">
        ${cur.choices.map(c => `
          <label class="choice-opt ${sel === c.id ? 'selected' : ''}" data-cid="${c.id}">
            <div class="dot"></div>
            <span>${c.label}</span>
          </label>
        `).join('')}
      </div>
    `;
  } else if (cur.type === 'relocation') {
    const sel = state.background.relocation;
    bodyHTML = `
      <div class="choice-list">
        ${cur.choices.map(c => `
          <label class="choice-opt ${sel === c.id ? 'selected' : ''}" data-cid="${c.id}">
            <div class="dot"></div>
            <span>${c.label}</span>
          </label>
        `).join('')}
      </div>
    `;
  } else if (cur.type === 'preferred-school') {
    const v = state.background.preferredSchool || '';
    const max = cur.maxLength || 120;
    bodyHTML = `
      <div class="field">
        <input type="text" id="fPreferredSchool" maxlength="${max}" placeholder="(선택) 예: ○○고등학교, 외고, 자사고 등" value="${escapeHtml(v)}" />
        <div style="font-size:12px;color:var(--ink-soft);text-align:right;margin-top:4px"><span id="psCount">${v.length}</span>/${max}자 · 비워두셔도 됩니다</div>
      </div>
    `;
  } else if (cur.type === 'region') {
    const sido = state.background.sido || '';
    const sigungu = state.background.sigungu || '';
    bodyHTML = `
      <div class="field">
        <label>시/도</label>
        <select id="fSido">
          <option value="">선택해 주세요</option>
          ${SIDO_OPTIONS.map(s => `<option ${sido===s?'selected':''}>${s}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>시/군/구</label>
        <input type="text" id="fSigungu" placeholder="예: 강남구" value="${escapeHtml(sigungu)}" />
      </div>
    `;
  } else if (cur.type === 'freetext') {
    const v = state.freetext[cur.id] || '';
    const max = cur.maxLength || 200;
    bodyHTML = `
      <div class="field">
        <textarea id="fFreetext" rows="4" maxlength="${max}" placeholder="(선택) 한두 줄로 적어주세요" style="width:100%;padding:12px;border:1px solid var(--line);border-radius:var(--radius-sm);font-family:var(--font-body);font-size:15px;line-height:1.5;resize:vertical;background:white;color:var(--ink)">${escapeHtml(v)}</textarea>
        <div style="font-size:12px;color:var(--ink-soft);text-align:right;margin-top:4px"><span id="ftCount">${v.length}</span>/${max}자 · 비워두셔도 됩니다</div>
      </div>
    `;
  } else {
    const cur_ans = state.answers[cur.id];
    bodyHTML = `
      <div class="likert">
        ${[1,2,3,4,5].map(v => `
          <label class="likert-opt ${cur_ans === v ? 'selected' : ''}" data-val="${v}">
            <div class="dot"></div>
            <span>${LIKERT_LABELS[v-1]}</span>
          </label>
        `).join('')}
      </div>
      <div class="likert-axis-labels"><span>← 아니다</span><span>그렇다 →</span></div>
    `;
  }

  main.innerHTML = `
    <div class="progress-shell">
      <div class="progress-meta">
        <span><strong>${state.questionIdx + 1}</strong> / ${total}</span>
        <span>${axisName}</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>

    <div class="card fade-in" key="${cur.id}">
      <div class="q-axis-tag">축 ${cur.axis} · ${axisName}</div>
      <div class="q-text">${cur.text}</div>
      ${cur.hint ? `<div class="q-hint">${cur.hint}</div>` : ''}
      ${bodyHTML}
      <div class="q-nav">
        <button class="btn btn-ghost" id="btnPrev" ${state.questionIdx === 0 ? 'disabled' : ''}>← 이전</button>
        <button class="btn btn-primary" id="btnNext">${state.questionIdx === total - 1 ? '제출 →' : '다음 →'}</button>
      </div>
    </div>
  `;

  // 타입별 입력 처리
  if (cur.type === 'multi-career') {
    main.querySelectorAll('.ms-card').forEach(card => {
      card.onclick = () => {
        const cid = card.dataset.cid;
        if (cid === 'unsure') {
          state.careerSelections = state.careerSelections.includes('unsure') ? [] : ['unsure'];
        } else {
          state.careerSelections = state.careerSelections.filter(x => x !== 'unsure');
          if (state.careerSelections.includes(cid)) {
            state.careerSelections = state.careerSelections.filter(x => x !== cid);
          } else {
            state.careerSelections.push(cid);
          }
        }
        render();
      };
    });
  } else if (cur.type === 'academic-rank' || cur.type === 'english-level' || cur.type === 'relocation') {
    const stateKey = cur.type === 'academic-rank' ? 'academicRank'
                   : cur.type === 'english-level' ? 'englishLevel'
                   : 'relocation';
    main.querySelectorAll('.choice-opt').forEach(opt => {
      opt.onclick = () => {
        const cid = opt.dataset.cid;
        state.background[stateKey] = cid;
        main.querySelectorAll('.choice-opt').forEach(o => o.classList.remove('selected'));
        opt.classList.add('selected');
        // 자동 진행 (다른 단일선택과 동일)
        setTimeout(() => {
          if (state.questionIdx < total - 1) {
            state.questionIdx += 1;
            render();
          }
        }, 280);
      };
    });
  } else if (cur.type === 'preferred-school') {
    const inp = document.getElementById('fPreferredSchool');
    const counter = document.getElementById('psCount');
    inp.oninput = () => {
      state.background.preferredSchool = inp.value;
      counter.textContent = inp.value.length;
    };
  } else if (cur.type === 'region') {
    document.getElementById('fSido').onchange = (e) => {
      state.background.sido = e.target.value;
    };
    document.getElementById('fSigungu').oninput = (e) => {
      state.background.sigungu = e.target.value;
    };
  } else if (cur.type === 'freetext') {
    const ta = document.getElementById('fFreetext');
    const counter = document.getElementById('ftCount');
    ta.oninput = () => {
      state.freetext[cur.id] = ta.value;
      counter.textContent = ta.value.length;
    };
  } else {
    // Likert
    main.querySelectorAll('.likert-opt').forEach(opt => {
      opt.onclick = () => {
        const v = parseInt(opt.dataset.val);
        state.answers[cur.id] = v;
        main.querySelectorAll('.likert-opt').forEach(o => o.classList.remove('selected'));
        opt.classList.add('selected');
        setTimeout(() => {
          if (state.questionIdx < total - 1) {
            state.questionIdx += 1;
            render();
          }
        }, 280);
      };
    });
  }

  // 이전/다음
  document.getElementById('btnPrev').onclick = () => {
    if (state.questionIdx > 0) {
      state.questionIdx -= 1;
      render();
    }
  };
  document.getElementById('btnNext').onclick = () => {
    // 응답 검증
    if (cur.type === 'multi-career') {
      if (state.careerSelections.length === 0) {
        alert('하나 이상 선택해 주세요. 잘 모르겠으면 마지막 항목을 선택하세요.');
        return;
      }
    } else if (cur.type === 'academic-rank') {
      if (!state.background.academicRank) {
        alert('학력 위치를 골라주세요. 모르시면 "잘 모르겠어요"를 선택하세요.');
        return;
      }
    } else if (cur.type === 'english-level') {
      if (!state.background.englishLevel) {
        alert('영어 수준을 골라주세요.');
        return;
      }
    } else if (cur.type === 'relocation') {
      if (!state.background.relocation) {
        alert('이사 가능 여부를 골라주세요. 모르시면 "잘 모르겠어요"를 선택하세요.');
        return;
      }
    } else if (cur.type === 'preferred-school') {
      // 선호 학교는 선택 입력 — 검증 생략
    } else if (cur.type === 'region') {
      if (!state.background.sido) {
        alert('시/도를 선택해 주세요.');
        return;
      }
    } else if (cur.type === 'freetext') {
      // 자유서술은 비워둘 수 있음 — 검증 생략
    } else if (state.answers[cur.id] == null) {
      alert('응답을 선택해 주세요.');
      return;
    }
    if (state.questionIdx < total - 1) {
      state.questionIdx += 1;
      render();
    } else {
      // 결과 계산
      finishQuiz();
    }
  };
}

async function finishQuiz() {
  const result = computeScores(state.answers, state.careerSelections, state.background);
  state.result = result;

  // 저장
  const record = {
    id: 'r' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
    name: state.name,
    phone: state.phone,
    grade: state.grade,
    school: state.school,
    completedAt: new Date().toISOString(),
    answers: state.answers,
    careerSelections: state.careerSelections,
    background: state.background,
    freetext: state.freetext,
    consent: state.consent,
    tokenCode: state.tokenCode || null,
    axisScore: result.axisScore,
    big5: result.big5,
    mentalKey: result.mental.key,
    mentalName: result.mental.name,
    typeScores: result.typeScores,
    ranking: result.ranking,
    mentalCap: result.mentalCap,
    academicCap: result.academicCap,
    careerCapList: result.careerCapList
  };

  const localOk = saveResponseSync(record);

  let cloudOk = false;
  let cloudError = null;
  if (isCloudEnabled()) {
    try {
      await cloudInsert(record);
      cloudOk = true;
    } catch(e) {
      cloudError = e.message;
      console.error('[Cloud] 저장 실패:', e);
    }
  }

  // 토큰 소비 (응답 저장 직후, 결과 표시 전)
  if (state.tokenCode && isCloudEnabled() && cloudOk) {
    try {
      await cloudConsumeToken(state.tokenCode, record.id);
      state.tokenConsumed = true;
    } catch(e) {
      // 토큰 소비 실패해도 결과 화면은 표시 (데이터 손실 방지 우선)
      console.warn('[Token] consume 실패:', e);
    }
  }

  if (!localOk && !cloudOk) {
    alert('⚠️ 응답 저장에 실패했습니다.\n결과는 표시되지만 데이터가 보관되지 않습니다.\n' +
          '브라우저의 localStorage 차단 여부 또는 네트워크를 확인해주세요.');
  } else if (isCloudEnabled() && !cloudOk) {
    console.warn('클라우드 저장 실패, 이 기기에는 저장됨:', cloudError);
  }

  state.view = 'done';
  render();
}

// 저장소: localStorage 기반 (브라우저 단독 동작 보장)
// ============================================================
const STORAGE_KEY = 'guide_v2_responses';

function loadAllResponsesSync() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return [];
    const list = JSON.parse(raw);
    return Array.isArray(list) ? list : [];
  } catch(e) {
    console.error('load 실패', e);
    return [];
  }
}

function saveResponseSync(record) {
  try {
    let list = loadAllResponsesSync();
    list.push(record);
    if (list.length > 2000) list = list.slice(-2000);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
    // 검증: 즉시 다시 읽어서 확인
    const verify = localStorage.getItem(STORAGE_KEY);
    if (!verify) return false;
    return true;
  } catch(e) {
    console.error('save 실패', e);
    return false;
  }
}

function saveAllResponsesSync(list) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
    return true;
  } catch(e) {
    console.error('save all 실패', e);
    return false;
  }
}

function deleteAllResponsesSync() {
  try {
    localStorage.removeItem(STORAGE_KEY);
    return true;
  } catch(e) { return false; }
}

function _cloudHeaders() {
  return {
    'apikey': SUPABASE_ANON_KEY,
    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
    'Content-Type': 'application/json'
  };
}

async function cloudInsert(record) {
  if (!isCloudEnabled()) throw new Error('Cloud not configured');
  const res = await fetch(`${SUPABASE_URL}/rest/v1/responses`, {
    method: 'POST',
    headers: { ..._cloudHeaders(), 'Prefer': 'return=minimal' },
    body: JSON.stringify({
      id: record.id,
      name: record.name || null,
      phone: record.phone || null,
      grade: record.grade || null,
      school: record.school || null,
      completed_at: record.completedAt,
      payload: record
    })
  });
  if (!res.ok) {
    const t = await res.text().catch(() => 'unknown error');
    throw new Error(`HTTP ${res.status}: ${t}`);
  }
  return true;
}

// ── 토큰 RPC 헬퍼 ──────────────────────────────────────────
async function cloudCreateToken(password, note) {
  if (!isCloudEnabled()) throw new Error('Cloud not configured');
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/admin_create_token`, {
    method: 'POST',
    headers: _cloudHeaders(),
    body: JSON.stringify({ pwd: password, p_note: note || null })
  });
  if (!res.ok) {
    const t = await res.text().catch(() => '');
    const tl = t.toLowerCase();
    if (tl.includes('locked')) throw new Error('Locked');
    if (tl.includes('unauthorized')) throw new Error('Unauthorized');
    throw new Error(`HTTP ${res.status}: ${t}`);
  }
  // RPC가 단일 text를 반환 → JSON 파싱 시 문자열로 옴
  return await res.json();
}

async function cloudListTokens(password) {
  if (!isCloudEnabled()) throw new Error('Cloud not configured');
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/admin_list_tokens`, {
    method: 'POST',
    headers: _cloudHeaders(),
    body: JSON.stringify({ pwd: password })
  });
  if (!res.ok) {
    const t = await res.text().catch(() => '');
    const tl = t.toLowerCase();
    if (tl.includes('locked')) throw new Error('Locked');
    if (tl.includes('unauthorized')) throw new Error('Unauthorized');
    throw new Error(`HTTP ${res.status}: ${t}`);
  }
  const rows = await res.json();
  return Array.isArray(rows) ? rows : [];
}

async function cloudConsumeToken(code, responseId) {

  }
  return true;
}

async function createNewToken() {
  const noteEl = document.getElementById('tokenNote');
  const resultEl = document.getElementById('tokenResult');
  const btn = document.getElementById('btnCreateToken');
  if (!noteEl || !resultEl || !btn) return;
  const note = (noteEl.value || '').trim();

    noteEl.focus();
    return;
  }
  btn.disabled = true;
  resultEl.innerHTML = '';
  try {
    const code = await cloudCreateToken(currentAdminPassword, note);
    const url = `${location.origin}${location.pathname}?t=${encodeURIComponent(code)}`;
    resultEl.innerHTML = `
      <div class="token-result">
        <span>✓ 새 링크 발급 완료 — 이 URL을 학부모에게 카카오톡·문자로 보내세요:</span>

    `;

async function loadTokenList() {
  const listEl = document.getElementById('tokenList');
  if (!listEl) return;
  listEl.innerHTML = '<div class="empty">불러오는 중…</div>';
  try {
    const tokens = await cloudListTokens(currentAdminPassword);
    if (!tokens || tokens.length === 0) {
      listEl.innerHTML = '<div class="empty">아직 발급된 링크가 없습니다.</div>';
      return;
    }
    listEl.innerHTML = tokens.map(tk => {
      const url = `${location.origin}${location.pathname}?t=${encodeURIComponent(tk.code)}`;
      const created = tk.created_at ? new Date(tk.created_at).toLocaleString('ko-KR', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' }) : '-';
      const consumed = tk.consumed_at ? new Date(tk.consumed_at).toLocaleString('ko-KR', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' }) : '';
      const used = !!tk.consumed_at;
      return `
        <div class="token-row">
          <div>
            <div class="code">${escapeHtml(tk.code)}</div>
            ${tk.note ? `<div class="note">${escapeHtml(tk.note)}</div>` : ''}
          </div>
          <div class="${used ? 'badge-used' : 'badge-fresh'}">${used ? '사용됨' : '미사용'}</div>
          <div style="font-size:11px;color:rgba(255,255,255,.55);line-height:1.3">
            발급 ${created}${used ? `<br>사용 ${consumed}` : ''}
          </div>
          <button class="copy-btn" data-url="${escapeHtml(url)}" ${used ? 'disabled style="opacity:.4;cursor:not-allowed"' : ''}>📋</button>
        </div>
      `;
    }).join('');
    listEl.querySelectorAll('.copy-btn[data-url]').forEach(btn => {
      if (!btn.disabled) btn.onclick = () => copyToClipboard(btn.dataset.url, '링크가 복사되었습니다');
    });
  } catch(e) {
    if (e.message === 'Locked') {
      listEl.innerHTML = '<div class="empty" style="color:#FFB5BD">5회 연속 실패로 1시간 잠금되었습니다.</div>';
    } else if (e.message === 'Unauthorized') {
      listEl.innerHTML = '<div class="empty" style="color:#FFB5BD">인증 만료. 다시 로그인해 주세요.</div>';
    } else {
      listEl.innerHTML = `<div class="empty" style="color:#FFB5BD">불러오기 실패: ${escapeHtml(e.message)}</div>`;
    }
  }
}

function copyToClipboard(text, successMsg) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(
      () => alert(successMsg || '복사되었습니다'),
      () => fallbackCopy(text, successMsg)
    );
  } else {
    fallbackCopy(text, successMsg);
  }
}
function fallbackCopy(text, successMsg) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); alert(successMsg || '복사되었습니다'); }
  catch(e) { prompt('아래 URL을 직접 복사하세요:', text); }
  finally { document.body.removeChild(ta); }
}

    if (tl.includes('unauthorized') || res.status === 401 || res.status === 403) {
      throw new Error('Unauthorized');

// ── Hexagon SVG (6축 visualization) ───────────────────────
function buildHexagonSVG(axisScore) {
  const labels = [
    {key:'A', name:'학업', x:0,  y:-1},
    {key:'B', name:'진로', x:.866,  y:-.5},
    {key:'C', name:'입시', x:.866, y:.5},
    {key:'D', name:'환경', x:0,  y:1},
    {key:'E', name:'심리', x:-.866, y:.5},
    {key:'F', name:'멘탈', x:-.866, y:-.5}
  ];
  const cx = 160, cy = 160, R = 110;
  // 격자 (5단계: 20, 40, 60, 80, 100)
  let grid = '';
  [20, 40, 60, 80, 100].forEach((g, idx) => {
    const r = (g / 100) * R;
    const pts = labels.map(l => `${cx + l.x*r},${cy + l.y*r}`).join(' ');
    grid += `<polygon points="${pts}" fill="${idx===4?'rgba(14,143,134,.04)':'none'}" stroke="var(--line)" stroke-width="1" />`;
  });
  // 축선
  let lines = '';
  labels.forEach(l => {
    lines += `<line x1="${cx}" y1="${cy}" x2="${cx + l.x*R}" y2="${cy + l.y*R}" stroke="var(--line)" stroke-width="1" />`;
  });
  // 데이터 다각형
  const dataPts = labels.map(l => {
    const v = axisScore[l.key] || 0;
    const r = (v / 100) * R;
    return `${cx + l.x*r},${cy + l.y*r}`;
  }).join(' ');
  // 데이터 점 + 라벨
  let dots = '';
  let textLabels = '';
  labels.forEach(l => {
    const v = axisScore[l.key] || 0;
    const r = (v / 100) * R;
    const px = cx + l.x*r;
    const py = cy + l.y*r;
    dots += `<circle cx="${px}" cy="${py}" r="4" fill="var(--teal-deep)" stroke="white" stroke-width="2" />`;
    const lblR = R + 22;
    const lx = cx + l.x*lblR;
    const ly = cy + l.y*lblR + 4;
    textLabels += `<text x="${lx}" y="${ly}" text-anchor="middle" fill="var(--ink)" font-size="13" font-weight="600" font-family="var(--font-display)">${l.name}</text>`;
    textLabels += `<text x="${lx}" y="${ly+14}" text-anchor="middle" fill="var(--ink-soft)" font-size="11" font-family="var(--font-body)">${v}</text>`;
  });
  return `
    <svg viewBox="0 0 320 320" width="320" height="320" xmlns="http://www.w3.org/2000/svg">
      ${grid}
      ${lines}
      <polygon points="${dataPts}" fill="rgba(14,143,134,.18)" stroke="var(--teal-deep)" stroke-width="2" stroke-linejoin="round" />
      ${dots}
      ${textLabels}
    </svg>
  `;
}

  // 토큰 발급 + 목록 (클라우드 모드 전용)

      const text = await file.text();

      if (!Array.isArray(incoming)) throw new Error('JSON이 응답 배열 형식이 아닙니다.');
      const existing = loadAllResponsesSync();
      const existingIds = new Set(existing.map(x => x.id));
      let added = 0, skipped = 0;
      incoming.forEach(rec => {
        if (rec && rec.id && !existingIds.has(rec.id)) {
          existing.push(rec);
          existingIds.add(rec.id);
          added++;
        } else { skipped++; }
      });
      const ok = saveAllResponsesSync(existing);
      if (!ok) { alert('병합 저장에 실패했습니다.'); return; }

    }
  };

      }

  };

  main.querySelectorAll('.admin-row[data-rid]').forEach(row => {

    };
  });
}

function showDetail(rec) {
  const big5Names = {N:'정서적 안정성', E:'외향성', C:'성실성', O:'개방성', A:'우호성'};

  const careerNames = {};
  CAREER_TRACKS.forEach(c => careerNames[c.id] = c.name);
  const selectedCareers = (rec.careerSelections || []).map(id => careerNames[id] || id).join(', ') || '-';

  const dt = rec.completedAt ? new Date(rec.completedAt).toLocaleString('ko-KR') : '-';

  // 응답별 텍스트 매핑 (리커트 문항만 — G/H는 별도 섹션)
  const ansRows = QUESTIONS.filter(q => !q.type || q.type === undefined).map(q => {
    const v = rec.answers?.[q.id];
    if (v == null) return '';
    return `
      <div class="q-answer-row">
        <div class="qid">${q.id}</div>
        <div class="qtext">${q.text}</div>
        <div class="qval v${v}">${v}</div>
      </div>
    `;
  }).join('');

  // 배경 정보 + 자유서술 (v2.1)
  const bg = rec.background || {};
  const ft = rec.freetext || {};
  const bgRows = [];
  if (bg.academicRank) bgRows.push(['학력 위치', ACADEMIC_RANK_LABELS[bg.academicRank] || bg.academicRank]);
  if (bg.sido) bgRows.push(['거주지', bg.sido + (bg.sigungu ? ' ' + bg.sigungu : '')]);
  if (bg.englishLevel) bgRows.push(['영어 수준', ENGLISH_LEVEL_LABELS[bg.englishLevel] || bg.englishLevel]);
  if (bg.preferredSchool && bg.preferredSchool.trim()) bgRows.push(['선호 학교', bg.preferredSchool.trim()]);
  if (bg.relocation) bgRows.push(['이사 가능 여부', RELOCATION_LABELS[bg.relocation] || bg.relocation]);
  const ftLabels = {
    H1: '지금 가장 큰 고민',
    H2: '최근 1년간 가장 큰 변화',
    H3: '학교 선택에서 가장 중요한 것'
  };
  const ftRows = ['H1','H2','H3'].filter(k => ft[k] && ft[k].trim()).map(k => [ftLabels[k], ft[k]]);
  const capBadges = [];
  if (rec.mentalCap) capBadges.push(`<span class="cap-badge ${rec.mentalCap}">멘탈 cap · ${rec.mentalCap}</span>`);
  if (rec.academicCap && rec.academicCap !== 'unknown') capBadges.push(`<span class="cap-badge ${rec.academicCap}">학력 cap · ${rec.academicCap}</span>`);
  else if (rec.academicCap === 'unknown') capBadges.push(`<span class="cap-badge info">학력 정보 미입력</span>`);
  if (rec.careerCapList && rec.careerCapList.length > 0) capBadges.push(`<span class="cap-badge info">계열 fit cap · ${[...new Set(rec.careerCapList)].join('·')}</span>`);

    <div class="detail-section">
      <h4>기본 정보</h4>

    <div class="detail-section">

    <div class="detail-section">
      <h4>고교 유형 추천 순위</h4>
      ${(rec.ranking || []).map((r, i) => `
        <div class="bar-row">
          <div class="label">${i+1}. ${r.type}</div>
          <div class="bar-track"><div class="bar-fill ${i===0?'':(i===1?'amber':'')}" style="width:${r.score}%"></div></div>

    <div class="detail-section">
      <h4>전체 응답 (1=전혀 그렇지 않다 ~ 5=매우 그렇다)</h4>

}

// ── 내보내기 ───────────────────────────────────────────────
function exportCsv(data) {
  const headers = [
    'id','name','grade','school','completedAt',
    'mentalName','top1_type','top1_score','top2_type','top2_score','top3_type','top3_score',
    'A','B','C','D','E','F',
    'big5_N','big5_E','big5_C','big5_O','big5_A',
    'careerSelections',
    // v2.1 \uC2E0\uADDC
    'academicRank','sido','sigungu','englishLevel','preferredSchool','relocation',
    'mentalCap','academicCap','careerCapList',
    'H1_\uACE0\uBBFC','H2_\uBCC0\uD654','H3_\uC911\uC694\uD55C\uAC83',
    'answersJson'
  ];
  const rows = data.map(d => {
    const careerNames = {};
    CAREER_TRACKS.forEach(c => careerNames[c.id] = c.name);
    const careers = (d.careerSelections || []).map(id => careerNames[id] || id).join('|');
    const bg = d.background || {};
    const ft = d.freetext || {};
    return [
      d.id, d.name, d.grade, d.school, d.completedAt,
      d.mentalName,
      d.ranking?.[0]?.type, d.ranking?.[0]?.score,
      d.ranking?.[1]?.type, d.ranking?.[1]?.score,
      d.ranking?.[2]?.type, d.ranking?.[2]?.score,
      d.axisScore?.A, d.axisScore?.B, d.axisScore?.C, d.axisScore?.D, d.axisScore?.E, d.axisScore?.F,
      d.big5?.N, d.big5?.E, d.big5?.C, d.big5?.O, d.big5?.A,
      careers,
      bg.academicRank || '', bg.sido || '', bg.sigungu || '', bg.englishLevel || '', bg.preferredSchool || '', bg.relocation || '',
      d.mentalCap || '', d.academicCap || '', (d.careerCapList || []).join('|'),
      ft.H1 || '', ft.H2 || '', ft.H3 || '',
      JSON.stringify(d.answers || {})
    ].map(v => csvEscape(v));
  });
  const csv = '\uFEFF' + [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  downloadBlob(blob, `responses_${new Date().toISOString().slice(0,10)}.csv`);
}
function csvEscape(v) {
  if (v == null) return '';
  const s = String(v);
  if (s.includes(',') || s.includes('"') || s.includes('\n')) {
    return '"' + s.replace(/"/g, '""') + '"';
  }
  return s;
}
function exportJson(data) {
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  downloadBlob(blob, `responses_${new Date().toISOString().slice(0,10)}.json`);
}
function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

// 클립보드 복사 (관리자용)
async function copyToClipboard(text, toastMsg) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      // 폴백: 임시 textarea 선택 후 execCommand
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    showToast(toastMsg || '복사됨');
  } catch (e) {
    showToast('복사 실패: ' + e.message);
  }
}

function showToast(msg) {
  let t = document.getElementById('admin-toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'admin-toast';
    t.className = 'admin-toast';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 1800);
}

// ============================================================
// Pinpad 이벤트
// ============================================================
document.getElementById('adminKeyBtn').onclick = () => {
  document.getElementById('pinpadShell').classList.add('open');
  document.getElementById('pinInput').value = '';
  document.getElementById('pinErr').textContent = '\u00A0';
  setTimeout(() => document.getElementById('pinInput').focus(), 100);
};
document.getElementById('pinCancel').onclick = () => {
  document.getElementById('pinpadShell').classList.remove('open');
};
document.getElementById('pinOk').onclick = tryPin;
document.getElementById('pinInput').onkeydown = (e) => {
  if (e.key === 'Enter') tryPin();
};
async function tryPin() {
  const v = document.getElementById('pinInput').value;
  const errEl = document.getElementById('pinErr');
  const okBtn = document.getElementById('pinOk');
  if (!v) { errEl.textContent = '비밀번호를 입력하세요'; return; }

  if (isCloudEnabled()) {
    // 클라우드 모드: 서버에 비밀번호 검증 요청
    errEl.textContent = '서버 확인 중…';
    okBtn.disabled = true;
    try {
      await cloudList(v);  // 성공하면 비밀번호 정상
      currentAdminPassword = v;
      document.getElementById('pinpadShell').classList.remove('open');
      state.view = 'admin';
      render();
    } catch(e) {
      if (e.message === 'Locked') {
        errEl.textContent = '5회 연속 실패하여 1시간 잠금되었습니다. 1시간 후 다시 시도하세요.';
      } else if (e.message === 'Unauthorized') {
        errEl.textContent = '비밀번호가 올바르지 않습니다.';
      } else {
        errEl.textContent = '서버 연결 실패: ' + e.message;
      }
    } finally {
      okBtn.disabled = false;
    }
  } else {
    // 로컬 모드
    if (v === ADMIN_PASSWORD) {
      currentAdminPassword = v;
      document.getElementById('pinpadShell').classList.remove('open');
      state.view = 'admin';
      render();
    } else {
      errEl.textContent = '비밀번호가 올바르지 않습니다.';
    }
  }
}

// ============================================================
// 부팅
// ============================================================
// 1. 일단 'checking' 상태로 게이트 화면(로더)부터 그린다
render();
// 2. 토큰 검증 후 결과를 state.tokenStatus에 반영하고 다시 렌더
checkToken();
