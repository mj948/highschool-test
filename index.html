<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>고교선택검사</title>
<meta name="description" content="아이가 어떤 조건에서 공부가 잘 유지되는지 정리하고, 학교를 비교할 때 확인할 것을 알려 주는 검사입니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>:root{
  --paper:#FFFFFF;--ink:#0E2A3D;--muted:#5B6E78;--faint:#8A9AA3;--ghost:#B4BEBB;
  --line:#E4E7E4;--line-mid:#C9D0CD;--teal:#0A6E66;--teal-wash:#EAF3F1;
  --amber:#C98A2B;--amber-wash:#FBF3E4;--rose:#B14A5A;
  --serif:"Noto Serif KR",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  /* 인쇄해서 보는 검사지라 밝은 화면 하나로 간다. 다크 모드 뷰어에서
     select·input이 브라우저 기본 다크 위젯으로 뜨는 것만 막는다. */
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;
     line-height:1.7;word-break:keep-all;-webkit-font-smoothing:antialiased}
.app{max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:0 24px}
.tnum{font-variant-numeric:tabular-nums}
.bar{padding:40px 0 0;flex-shrink:0}
.bar-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.bar-ax{font-size:11px;letter-spacing:.14em;color:var(--faint);font-weight:500}
.bar-ax.kid{color:var(--amber)}
.bar-n{font-size:11px;color:var(--faint);white-space:nowrap}
.bar-t{display:flex;gap:2px;margin-top:9px}
.bar-f{height:2px;background:var(--ink);transition:flex .25s ease}
.bar-f.kid{background:var(--amber)}
.bar-r{height:2px;background:var(--line);transition:flex .25s ease}
main{flex-grow:1;display:flex;flex-direction:column;padding:34px 0 0}
h1.q{margin:0;font-size:20px;font-weight:700;line-height:1.6;letter-spacing:-.01em;text-wrap:pretty}
.q-stem{font-size:13px;color:var(--amber);font-weight:500;margin-bottom:9px}
.q-hint{font-size:13px;color:var(--faint);line-height:1.7;margin-top:10px}
.q-ex{font-size:14px;color:var(--muted);line-height:1.7;margin-top:9px}
.opts{list-style:none;margin:28px 0 0;padding:0;display:flex;flex-direction:column}
.rule{height:1px;background:var(--line);flex-shrink:0}
.rule.top{height:1.5px;background:var(--ink)}
.opt{display:flex;gap:14px;align-items:flex-start;padding:17px 2px;cursor:pointer;transition:background .12s}
.opt:active{background:var(--teal-wash)}
.dot{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line-mid);flex-shrink:0;
     margin-top:3px;transition:border-width .12s,border-color .12s}
.dot.sq{border-radius:3px}
.opt.on .dot{border-color:var(--teal);border-width:6px}
.opt.on .dot.sq{border-width:1.5px;background:var(--teal);box-shadow:inset 0 0 0 2px #fff}
.opt .lab{font-size:16px;line-height:1.6;flex-grow:1}
.opt.on .lab{font-weight:600}
.opt .sub{display:block;font-size:12.5px;color:var(--faint);margin-top:3px;font-weight:400}
.grid{margin-top:22px}
.ghead,.grow{display:grid;grid-template-columns:56px minmax(0,1fr) minmax(0,1fr);gap:9px}
.ghead{padding-bottom:8px;font-size:11px;letter-spacing:.06em;color:var(--faint)}
.ghead span:not(:first-child){text-align:center}
.grow{align-items:center;padding:9px 0}
.grow .sb{font-size:15px;font-weight:500}
.grid input,input.txt,select{width:100%;border:1px solid var(--line-mid);border-radius:4px;
  padding:11px 10px;font-size:16px;background:var(--paper);color:var(--ink);font-family:var(--sans)}
.grid input{text-align:center;font-family:var(--mono);font-variant-numeric:tabular-nums}
.grid input:focus,input.txt:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal);border-width:1.5px}
textarea{width:100%;border:1px solid var(--line-mid);border-radius:4px;padding:13px;font-family:var(--sans);
  font-size:15px;line-height:1.7;background:var(--paper);color:var(--ink);resize:vertical;min-height:104px;margin-top:20px}
.foot{display:flex;justify-content:space-between;align-items:center;padding:20px 0 34px;flex-shrink:0;gap:12px}
.back{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--faint);cursor:pointer}
.back.off{opacity:.25;pointer-events:none}
.tip{font-size:12px;color:var(--ghost);text-align:right}
.btn{background:var(--ink);color:var(--paper);text-align:center;padding:17px 0;border-radius:4px;
  font-size:16px;font-weight:500;cursor:pointer;border:none;width:100%;font-family:var(--sans);display:block}
.btn[disabled]{background:var(--line);color:var(--ghost);cursor:default}
.btn.ghost{background:transparent;color:var(--muted);font-size:14px;padding:12px 0;font-weight:400;margin-top:6px}
.center{flex-grow:1;display:flex;flex-direction:column;justify-content:center}
.mark{width:44px;height:1.5px;background:var(--ink)}
.mark.amber{background:var(--amber)}
h1.big{margin:20px 0 0;font-family:var(--serif);font-size:25px;font-weight:700;line-height:1.5;letter-spacing:-.02em}
.lead{font-size:15px;color:var(--muted);line-height:1.8;margin-top:13px}
.facts{display:flex;flex-direction:column;margin-top:30px}
.fact{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:baseline;padding:13px 0;gap:10px}
.fact .k{font-size:14px;color:var(--muted)}
.fact .v{font-size:15px;font-weight:500;text-align:right}
.fine{font-size:12.5px;color:var(--faint);line-height:1.75;margin-top:20px}
.res section{padding:32px 0 0}
.res h2{font-family:var(--serif);font-size:21px;font-weight:700;line-height:1.5;margin:0;letter-spacing:-.015em}
.res .eyebrow{font-size:11px;letter-spacing:.14em;color:var(--faint);font-weight:500;margin-bottom:9px}
.obs{padding:16px 0;font-size:14.5px;line-height:1.8}
.obs b{font-weight:700}
.bucket{padding:16px 0}
.bucket .bt{font-size:16px;font-weight:700;margin-bottom:4px}
.bucket .bd{font-size:13.5px;color:var(--muted);line-height:1.75}
.bucket .tag{font-size:11px;letter-spacing:.06em;color:var(--faint);margin-bottom:8px}
.bucket .ex{font-size:13px;color:var(--muted);line-height:1.85;margin-top:7px;padding:9px 12px;background:#F5F8F9;border-radius:5px}
.bucket .ex .exl{display:block;font-size:11px;letter-spacing:.06em;color:var(--faint);margin-bottom:3px}
.bucket .ex .exr{font-size:11.5px;color:var(--faint);margin-left:2px}
.bucket .ex .exn{font-size:12px;color:var(--faint);line-height:1.7;margin-top:5px}
.trk{display:grid;grid-template-columns:86px minmax(0,1fr);gap:11px;align-items:center;padding:11px 0;color:var(--faint)}
.trk.on{color:var(--ink)} .trk.on .n{font-weight:700}
.trk .n{font-size:14.5px}
.pips{display:flex;gap:3px}
.pip{height:8px;flex:1;background:#EDEFEC;border-radius:1px}
.pip.f{background:var(--line-mid)} .trk.on .pip.f{background:var(--ink)}
.note{border-left:2px solid var(--ink);padding:2px 0 2px 14px;margin-top:18px;font-size:13.5px;color:var(--muted);line-height:1.75}
.note.amber{border-left-color:var(--amber)}
.disclaim{font-size:12.5px;color:var(--faint);line-height:1.75;margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
.adm{position:fixed;top:10px;right:10px;font-size:11px;color:var(--ghost);background:transparent;
     border:1px solid var(--line);border-radius:3px;padding:5px 9px;cursor:pointer;font-family:var(--sans);z-index:50}
.sheet{position:fixed;inset:0;background:var(--paper);z-index:100;overflow-y:auto;padding:24px}
.sheet .wrap{max-width:960px;margin:0 auto}
.sheet table{width:100%;border-collapse:collapse;font-size:13px}
.sheet th,.sheet td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.sheet th{font-size:11px;letter-spacing:.06em;color:var(--faint);font-weight:600;white-space:nowrap}
.sheet tr{cursor:pointer}
.badge{font-family:var(--mono);font-size:10px;border:1px solid var(--line-mid);border-radius:3px;padding:1px 5px;color:var(--muted)}
.badge.old{color:var(--rose);border-color:var(--rose)}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:380px){
  .app{padding:0 16px}
  h1.q{font-size:18px} .opt .lab{font-size:15px}
  .ghead,.grow{grid-template-columns:44px minmax(0,1fr) minmax(0,1fr);gap:6px}
  .grid input{padding:10px 4px;font-size:15px}
  .fact{grid-template-columns:1fr auto}
}
@media print{
  @page{margin:14mm 12mm}
  html,body{background:#fff!important;color:#000!important;font-size:10.5pt;line-height:1.65}
  .bar,.foot,.btn,.adm,.sheet{display:none!important}
  .app{max-width:none;padding:0;min-height:0}
  .print-head{display:block!important}
  .res section{padding:14pt 0 0;break-inside:avoid;page-break-inside:avoid}
  .res h2{font-size:13pt;margin:0 0 6pt}
  .res .eyebrow{font-size:7.5pt;letter-spacing:.12em;color:#555}
  .obs,.bucket,.note,.fine,.disclaim{break-inside:avoid;page-break-inside:avoid}
  .obs{font-size:10.5pt;padding:7pt 0}
  .bucket{padding:7pt 0}
  .bucket .bt{font-size:11pt}
  .bucket .bd,.note{font-size:9.5pt;color:#222}
  .bucket .ex{font-size:9pt;background:transparent;padding:4pt 0;color:#333}
  .note{border-left:2pt solid #000;padding-left:8pt;margin-top:8pt}
  .note.amber{border-left-color:#8a6b1f}
  .rule{background:#bbb;height:.4pt}
  .rule.top{background:#000;height:.9pt}
  .trk{padding:5pt 0;color:#555}
  .trk.on{color:#000}
  .pip{background:#e5e5e5;height:6pt}
  .pip.f{background:#999} .trk.on .pip.f{background:#000}
  .disclaim{margin-top:14pt;padding-top:8pt;border-top:.4pt solid #bbb;font-size:8.5pt;color:#444}
  a[href]:after{content:""}
}
.print-head{display:none}
@media print{
  .print-head{margin:0 0 10pt;padding-bottom:6pt;border-bottom:1pt solid #000}
  .print-head .t{font-family:var(--serif);font-size:15pt;font-weight:700;margin:0}
  .print-head .m{font-size:8.5pt;color:#555;margin-top:3pt;display:flex;gap:10pt;flex-wrap:wrap}
}
</style>

":"boarding","text":"기숙사가 어렵다고 하셨는데 통학으로 닿기 어려운 거리입니다."}],"soft":[{"if":{"A5":"C"},"flag":["광역 자사고","외고","국제고","전국 자사고"],"reason":"tuition","text":"학비가 현실적으로 어렵다고 하셔서 우선순위를 낮췄습니다. 다만 같은 유형 안에서도 학비 차이가 크고 장학금이 있는 학교도 있어, 관심 있는 학교는 개별 확인이 필요합니다."},{"if":{"A5":"B"},"flag":["전국 자사고"],"reason":"tuition_adjust","text":"학비를 조정하면 가능하다고 하셨습니다. 학교별 실제 비용을 확인해 보세요."}],"note":"하드 필터는 통학·기숙처럼 유형 전체에 물리적으로 적용되는 조건만 쓴다. 비용은 학교마다 달라 하드 탈락시키지 않는다."},"stage2":{"name":"현재 학력 위치","skipGrades":["e34","e56","h1"],"showNumbers":false,"measured":{"formula":"평균(원점수 − 과목평균), 다섯 과목","bands":[{"delta":30,"minRaw":97,"pos":2},{"delta":25,"minRaw":95,"pos":5},{"delta":25,"pos":8},{"delta":18,"pos":15},{"delta":10,"pos":30},{"delta":5,"pos":40},{"delta":0,"pos":50}]},"simple":{"from":"B3","map":{"60":78,"75":55,"82":34,"87":22,"92":12,"95":6},"lowestAdjust":{"from":"B4","rule":"가장 낮은 과목이 평균보다 두 구간 이상 아래면 위치를 한 구간 뒤로 민다","note":"한 과목이 무너지면 밀집 학교에서 특히 불리하다. 결과에는 '한 과목을 먼저 올리는 편이 낫다'는 안내로 쓴다."},"noInfo":["X"],"topSignal":{"when":"B3가 A(95점 이상)이고 B5 3월 모의 평균이 2등급 이하","pos":3,"note":"점수만으로는 상위 28%가 다 A로 뭉쳐 최상위가 안 잡힌다(세미나 §반론). 3모 최상위가 함께면 상위 3%로 본다. 이게 없으면 성적표 숫자 경로로 유도하는 안내를 띄운다."},"hint":{"when":"밀집 유형(전국자사고 이상)에 관심·준비가 있는데 간이 경로만 탔다","text":"자사고·특목고를 함께 보시려면 성적표 숫자를 넣어 주세요. 점수대만으로는 최상위 판정이 어렵습니다."}},"cut":{"inside":34,"outOfGroup":100},"note":"계산 결과를 화면에 숫자로 내지 않는다. 유형을 어느 묶음에 넣을지 정하는 데만 쓴다. 과학고·영재학교는 내신 등급이 아니라 별도 전형(지필·자기주도학습)으로 뽑으므로 학력 위치 컷을 적용하지 않는다. 세미나도 '등급 계산 대상이 아니다'로 못 박았다.","inputs":{"path":"B1","measured":"B2","simpleAverage":"B3","simpleLowest":"B4","examMeasured":"B5","note":"B1이 A면 B2(숫자 그리드), B면 B3·B4(간이 구간)로 간다. 두 경로는 동시에 뜨지 않는다."},"skipTypesForPosition":["과학고","영재학교"]},"stage3":{"name":"그 환경에서 공부가 유지될 가능성","dropsTypes":false,"note":"이 단계는 유형을 탈락시키지 않는다. '조건 확인' 묶음으로 옮기고 이유 문장을 붙인다. 성향 하나로 학교를 없애지 않는다.","signals":[{"id":"recovery","from":["F1","F2"],"role":"결과가 나쁜 뒤 공부로 돌아오는 속도","low":{"when":"두 문항 평균 lvl 2 이하","affects":"dense","move":"conditional","text":"시험 결과가 좋지 않을 때 공부 리듬을 되찾는 데 시간이 걸린다고 답하셨습니다. 경쟁이 강한 학교를 볼 때는 성적보다 먼저 이 반응을 확인할 필요가 있습니다."}},{"id":"self_standard","from":["D1","D2","D3"],"role":"자기 기준에 미달했을 때의 반응","high":{"when":"'거의 매번' 또는 '자주'가 두 개 이상","affects":"dense","move":"conditional","text":"잘한 시험에서도 아쉬운 부분을 오래 마음에 두는 편이라고 답하셨습니다. 상위권이 몰린 학교에서는 이 성향이 부담으로 작용할 수 있습니다."}},{"id":"competition","from":["E1","E2","K1"],"role":"주변의 잘하는 아이를 공부 동력으로 바꾸는 정도","fuel":{"when":"E1이 '자주' 이상이고 E2가 A","affects":"dense","move":"keep","text":"잘하는 친구가 있을 때 공부량이 늘어난다고 답하셨습니다. 경쟁이 부담으로만 작용하는 아이는 아닙니다. 학업 수준이 높은 학교를 볼 때 이 점은 장점이 될 수 있습니다."},"steady":{"when":"E2가 B","affects":"dense","move":"conditional","text":"자기가 잘하고 있다는 느낌이 있을 때 공부가 안정적이라고 답하셨습니다. 상위권이 몰린 학교에서는 초반 성적 위치를 먼저 확인해 보세요."}},{"id":"exam_fit","from":["C1","C2","B5"],"role":"범위가 있는 시험과 없는 시험에서의 차이","measuredFirst":{"from":"B5.followUp","rule":"학력 위치가 20퍼센트 안쪽인데 3월 모의 평균이 3등급 이상이면 prepared, 위치가 50퍼센트 밖인데 2등급 이하면 unbounded"},"prepared":{"text":"범위가 정해진 시험에서 준비한 만큼 결과가 나오는 편이라고 답하셨습니다. 학교를 볼 때 한 과목당 수강 인원이 충분해 등급이 나오는 구조인지 확인해 보세요."},"unbounded":{"text":"범위를 주지 않는 시험에서도 결과 차이가 크지 않다고 답하셨습니다. 자습 시간이 확보되는지도 함께 보시면 좋습니다."},"notMeasured":{"when":"C1·C2를 묻지 않은 학년이다","action":"이 항목을 결과에 넣지 않는다"}},{"id":"self_management","from":["G1","G2","G3","K2"],"role":"공부 순서와 계획을 스스로 잡는 정도","guided":{"when":"G1과 G2가 모두 B이거나 G3이 lvl 2 이하","affects":"all","move":"note","text":"공부 순서와 방학 계획을 부모나 학원에서 정해 주는 경우가 많다고 답하셨습니다. 학교를 고를 때는 자율성만 강조하는 곳보다 일정한 학습 관리가 있는지 확인하는 편이 좋습니다."},"self":{"text":"공부 순서와 계획을 아이가 직접 정하는 편이라고 답하셨습니다. 자율 학습 시간이 많은 학교도 무리 없이 볼 수 있습니다."}},{"id":"peer_pref","from":["K3"],"role":"또래 환경 선호","homogeneous":{"text":"아이는 대부분 공부에 집중하는 분위기의 반이 편하다고 했습니다."},"diverse":{"text":"아이는 관심사가 다양한 아이들이 섞인 반이 편하다고 했습니다. 학업 분위기가 균질한 학교를 볼 때는 이 점을 함께 고려해 보세요."}}],"gapReport":{"pairs":[["G1","K2"],["G2","K2"],["E2","K1"]],"note":"부모 응답과 아이 응답이 다를 때 어느 쪽도 정답으로 처리하지 않는다. 차이만 적는다.","text":"아이는 스스로 정한다고 답했고 보호자는 일정한 관리가 필요하다고 보셨습니다. 고교 선택 전에 실제 일주일 계획을 누가 세우는지 한 번 확인해 보세요."}},"stage4":{"name":"교육과정과 관심 분야","interest":{"from":"K5-*","scale":"interest4","accept":"'꼭 해보고 싶다' 또는 '꽤 해보고 싶다'","relative":true,"rule":"상위 두 계열까지만 '상대적으로 더 관심을 보인 활동'으로 표시한다. 1위 하나를 적성으로 확정하지 않는다.","flat":{"when":"모든 계열이 같은 값이거나 accept가 하나도 없다","text":"활동별 관심의 차이가 크지 않았습니다. 지금 한쪽으로 정할 필요는 없습니다."}},"stated":{"from":"K4","priority":"아이가 고른 관심 분야를 우선한다. 흥미 문항은 대조 정보로만 쓴다.","mismatch":"아이는 {stated}를 관심 분야로 골랐지만, 활동 선택에서는 {measured} 쪽에도 관심이 나타났습니다. 지금 한쪽으로 정할 필요는 없고 두 방향의 실제 활동을 모두 경험해 보는 편이 좋겠습니다."},"curriculum":[{"if":"외국어·국제 어느 쪽도 관심에 없다","affects":["외고","국제고"],"handled":"eligibility","text":"외국어나 국제 분야에 대한 관심이 뚜렷하지 않아 외고·국제고는 후보에서 뺐습니다."},{"if":"이공(비메디컬)에 관심이 있다","affects":"all","move":"note","text":"물리·화학과 심화 과목이 실제로 개설되는지, 그 과목을 듣는 인원이 충분한지 학교별로 확인하세요. 선택자가 적으면 등급 자체가 안 나옵니다."},{"if":"메디컬에 관심이 있다","affects":"all","move":"note","text":"내신이 극상위여야 하고, 비수도권이라면 지역인재 자격이 학교 선택을 좌우합니다. 해당 지역이라면 그 지역을 유지하는 편이 다른 조건보다 우선입니다."},{"if":"인문·사회에 관심이 있다","affects":"all","move":"note","text":"사회 과목 개설 범위와 문과 인원을 학교별로 확인하세요. 이과 쏠림이 심한 학교에 문과로 들어가면 과목마다 손해를 봅니다."}],"branch":{"from":"H1","A":{"text":"과학고나 영재학교를 준비 중이라고 하셨습니다. 이 두 학교는 내신 등급이 아니라 별도 전형으로 뽑기 때문에 이 검사의 유형 비교와는 다른 준비가 필요합니다.","excludeFromCompare":true},"B":{"text":"과학고나 영재학교에 관심이 있다고 하셨습니다. 전형 방식과 준비 기간이 일반 고교 선택과 크게 다르니 먼저 전형 일정을 확인해 보세요."},"C":{}}},"stage5":{"name":"최종 분류","buckets":[{"id":"primary","title":"현재 우선 검토할 수 있는 유형","when":"현실 조건을 통과하고, 학력 위치가 안쪽이며, 환경 우려 표시가 없다"},{"id":"conditional","title":"조건을 확인한 뒤 검토할 유형","when":"통과했지만 환경 우려나 비용 조정, 학력 위치 바깥, 교육과정 확인이 필요하다"},{"id":"low","title":"현재 우선순위가 낮은 유형","when":"통학·기숙으로 닿지 않거나, 현재 학력 위치가 지원자 범위 밖이다"}],"noRanking":true,"note":"묶음 안에서 점수로 줄 세우지 않는다. 후보가 둘 이상이면 TB로 순서만 확인한다.","tie":{"askTB1":"primary 묶음에 유형이 둘 이상","askTB2":"외고·국제고가 남았고 외국어·국제 관심이 함께 있다","note":"TB1의 A·B를 특정 학교 유형에 1대 1로 대응시키지 않는다. 남아 있는 실제 후보의 성격과 연결한다.","questions":{"TB1":"primary 묶음에 유형이 둘 이상일 때","TB2":"외고·국제고가 남았고 외국어·국제 관심이 함께 있을 때"}}},"gradeFrames":{"e34":{"typeRanking":false,"sections":["study_profile","management","competition","inter cy":{"v2SchemaKey":"guide_v2_responses","readOnly":true,"note":"과거 v2 응답은 관리자 화면에서 버전 표시 후 구버전 형식으로 열람만 한다. 새 판정 로직을 적용하지 않는다."},"visibility":{"requires":"문항의 requires가 학년의 has에 모두 들어 있어야 띄운다.","note":"전제를 못 채우는 학년에게 그 문항을 보여 주지 않는다. 답할 수 없는 질문을 만들지 않기 위한 규칙이다."},"typeNote":"세미나 집단 퍼센트를 그대로 쓴다. 영재 1 · 과학고 2 · 전국자사고 5 · 외고·국제고 10 · 광역자사고 25 · 일반고 100. 이 값은 유형을 어느 묶음에 넣을지 정하는 데만 쓰고 화면에 숫자로 내지 않는다.","eligibility":{"note":"관심·준비가 맞지 않는 유형은 후보에서 아예 빼서 화면을 어지럽히지 않는다. 칼럼도 그 아이에게 맞는 유형만 짚어 준다.","일반고":"항상 후보. 어느 아이든 갈 수 있다.","광역 자사고":"항상 후보. 성적·기질로 묶음이 갈린다.","전국 자사고":"항상 후보. 성적·기질·현실 조건으로 갈린다.","외고":"아이가 외국어에 관심을 보였을 때만 후보 (K4의 lang 또는 흥미 lang).","국제고":"아이가 국제에 관심을 보였을 때만 후보 (K4의 intl 또는 흥미 intl).","과학고":"이공·메디컬 관심 + H1이 A(준비 중) 또는 B(관심)일 때만 후보.","영재학교":"과학고와 같은 조건. 지필·캠프로 뽑는 최상위 전형이라 준비가 전제.","학군지 일반고":"항상 후보. 사는 곳이 학군지인지, 이사가 가능한지로 묶음이 갈린다."},"specialBranch":{"note":"과학고·영재학교는 내신 등급이 아니라 별도 전형(지필·자기주도학습)으로 뽑는다. 후보로 이름은 내되, '이 검사의 성향 판정과 별개로 전형 준비가 필요하다'를 반드시 붙인다.","H1_A":"이미 준비 중이라고 하셨습니다. 전형 일정과 준비 상태를 기준으로 보시면 됩니다.","H1_B":"관심은 있지만 준비 전이라고 하셨습니다. 전형 방식과 준비 기간이 일반 고교 선택과 크게 달라, 먼저 전형 일정을 확인해 보세요."},"direction":{"forGrades":["e12","e34","e56"],"note":"초등에게 유형 순위를 주지 않는다. 지금 성향에서 보이는 환경의 결과, 관심이 이어지면 어떤 길이 있는지 알아두기까지만 낸다.","env":{"competitive":"잘하는 친구가 있을 때 더 하는 편입니다. 지금 성향으로는 학업 분위기가 있는 환경이 맞아 보입니다.","managed":"아직 공부 계획은 챙겨 줘야 하는 편입니다. 스스로 맡기기보다 관리가 되는 환경이 도움이 됩니다.","gentle":"결과가 좋지 않을 때 돌아오는 데 시간이 걸리는 편입니다. 경쟁이 센 환경보다 자신감을 쌓을 수 있는 환경이 낫습니다.","steady":"자기 페이스가 있는 편입니다. 지금은 특정 환경을 고르기보다 이 페이스를 지켜봐 주시면 됩니다."},"interest":{"eng":"과학·만들기 쪽에 끌립니다. 이 관심이 이어지고 성적이 잘 나오면 중고등에서 과학고·영재학교나 이과가 강한 학교도 선택지에 들어옵니다. 지금은 그런 길이 있다는 정도만 알아두시면 됩니다.","med":"몸·생명 쪽에 끌립니다. 이 관심이 이어지면 이과·의학 계열의 길이 있습니다. 아직 정할 일은 아닙니다.","lang":"외국어에 끌립니다. 이 관심이 이어지면 외국어고나 국제고 같은 길이 있습니다. 지금은 언어에 재미를 붙이는 게 먼저입니다.","intl":"다른 나라·세계 쪽에 끌립니다. 이 관심이 이어지면 국제고 같은 길이 있습니다.","soc":"사람·사회 쪽에 끌립니다. 대부분의 일반고에서 넓게 갈 수 있는 방향입니다.","art":"표현·만들기 쪽에 끌립니다. 이 관심이 이어지면 관련 진로를 더 알아보시면 됩니다."},"caveat":"초등학생의 성향은 몇 년 사이 크게 달라집니다. 지금 학교를 정하는 게 아니라, 앞으로 지켜볼 방향을 잡는 것입니다."},"schoolExamples":{"note":"유형마다 실제로 어떤 학교가 해당하는지 이름을 보여 준다. 추천이 아니라 예시다. 지역 단위로 뽑는 유형은 사는 시·도의 학교만 보여 준다.","asOf":"2027학년도","source":"2027학년도 자기주도학습전형 및 고등학교 입학전형 영향평가 매뉴얼(한국교육개발원 CRM 2026-19) 원문 · 학교별 2027 모집요강 · 자소서첨삭기 근거대장_2027.md 대조","caption":"추천이 아니라 이 유형에 어떤 학교가 있는지 보여 드리는 목록입니다. 모집 범위와 지원 자격은 학교마다 다르니 요강에서 확인하세요.","byType":{"광역 자사고":{"scope":"region","byRegion":{"서울":[{"n":"경희고"},{"n":"배재고"},{"n":"보인고"},{"n":"선덕고"},{"n":"세화고"},{"n":"세화여고"},{"n":"신일고"},{"n":"양정고"},{"n":"이화여고"},{"n":"중동고"},{"n":"중앙고"},{"n":"한대부고"},{"n":"현대고"},{"n":"휘문고"}],"부산":[{"n":"부일고"},{"n":"해운대고"}],"대구":[{"n":"계성고"}],"인천":[{"n":"인천포스코고"}],"대전":[{"n":"대전대성고"},{"n":"대전대신고"}],"경기":[{"n":"안산동산고"}],"충남":[{"n":"충남삼성고"}]},"noneText":"{sido}에는 광역 자사고가 없습니다. 자사고가 없는 시·도의 중학생은 다른 지역 광역 자사고에 지원할 수 있습니다.","footByRegion":{"서울":"서울 자사고는 지원율이 100퍼센트 이하면 전원 합격이고 면접이 없습니다. 120퍼센트를 넘으면 추첨이나 면접으로 갑니다."},"foot":"서울 밖 자사고는 추첨이 없습니다. 1단계 내신으로 거른 뒤 2단계에서 면접을 봅니다."},"전국 자사고":{"scope":"national","list":[{"n":"하나고","r":"서울","note":"일반전형은 서울에 사는 학생만 지원할 수 있습니다."},{"n":"외대부고","r":"용인"},{"n":"민사고","r":"횡성"},{"n":"상산고","r":"전주"},{"n":"현대청운고","r":"울산"},{"n":"북일고","r":"천안"},{"n":"김천고","r":"김천"},{"n":"포항제철고","r":"포항"},{"n":"광양제철고","r":"광양"},{"n":"인천하늘고","r":"인천"}]},"외고":{"scope":"region","byRegion":{"서울":[{"n":"대원외고"},{"n":"대일외고"},{"n":"명덕외고"},{"n":"한영외고"},{"n":"이화여자외고"},{"n":"서울외고"}],"경기":[{"n":"수원외고"},{"n":"성남외고"},{"n":"동두천외고"},{"n":"고양외고"},{"n":"과천외고"},{"n":"김포외고"},{"n":"안양외고"},{"n":"경기외고"}],"인천":[{"n":"인천외고"},{"n":"미추홀외고"}],"부산":[{"n":"부산외고"}],"대구":[{"n":"대구외고"}],"대전":[{"n":"대전외고"}],"울산":[{"n":"울산외고"}],"충북":[{"n":"청주외고"}],"충남":[{"n":"충남외고"}],"전북":[{"n":"전북외고"}],"전남":[{"n":"전남외고"}],"경북":[{"n":"경북외고"}],"경남":[{"n":"경남외고"},{"n":"김해외고"}],"제주":[{"n":"제주외고"}]},"noneText":"{sido}에는 외고가 없습니다. 사는 시·도 밖은 지원 범위를 요강에서 먼저 확인하셔야 합니다."},"국제고":{"scope":"region","byRegion":{"서울":[{"n":"서울국제고"}],"경기":[{"n":"고양국제고"},{"n":"동탄국제고"},{"n":"청심국제고","note":"전국에서 지원할 수 있습니다."}],"부산":[{"n":"부산국제고"}],"인천":[{"n":" 시","세종시",""],"경남":["창원시"]},"resident":{"text":"지금 사시는 곳이 흔히 학군지로 불리는 지역입니다. 따로 이사하지 않아도 배정 범위 안입니다."},"movable":{"text":"학교에 따라 이사도 고려할 수 있다고 하셨습니다. 학군지 일반고는 이사를 전제로 하는 선택입니다.","kind":"move"},"fixed":{"text":"지금 거주지를 유지해야 한다고 하셔서 배정 범위 밖입니다.","kind":"move"},"cost":"학군지 일반고는 얻는 것과 치르는 것이 같이 있습니다. 수업 진도와 또래, 입시 정보는 앞서지만 같은 실력으로도 내신 등수는 뒤로 밀립니다. 둘을 같이 놓고 보셔야 합니다.","caption":"학군지는 공식 구분이 아닙니다. 학원가가 몰려 있고 일반고 안에서도 상위권이 두껍게 모인다고 불리는 곳을 저희가 추렸습니다. 여기 없는 지역이라도 학교별로 확인하시면 됩니다.","display":{"서울":"강남구·서초구·송파구·양천구·노원구","경기":"성남시·안양시·고양시·용인시","인천":"연수구","부산":"해운대구·남구","대구":"수성구","대전":"서구·유성구","광주":"남구","울산":"남구","세종":"전 지역","경남":"창원시"},"capital":["서울","경기","인천"],"regionalTalent":{"when":"비수도권에 살고 메디컬 관심이 있는데 학군지 일반고가 후보에 남아 있다","text":"메디컬에 관심이 있다고 하셨는데, 지금 비수도권에 사십니다. 수도권 학군지로 옮기면 의약계열 지역인재 자격이 사라집니다. 비수도권 안에서 옮기면 권역만 바뀌고 자격은 남습니다. 이사를 놓고 보실 때 이 순서가 학군보다 먼저입니다.","basis":"지방대육성법상 비수도권 의약학계열 지역인재 의무선발(강원·제주 20퍼센트, 그 밖 40퍼센트) · 2028학년도부터 비수도권 중학교 전 교육과정 이수·졸업 요건 추가 · 로컬 대조 `반복 패턴.md` 2026-07-13","note":"권역 일치가 아니라 비수도권이면 된다. 자격이 진짜 사라지는 건 수도권 소재 학교뿐이다. 이 구분을 뭉개지 않는다."}},"equalization":{"note":"평준화 지역은 성적으로 학교를 고르는 게 아니라 지망한 학교 중에서 추첨으로 배정받는다. 그래서 학부모가 할 일이 '어느 학교를 갈 수 있나'가 아니라 '1지망을 어디로 쓰나'로 바뀐다. 비평준화는 반대다. 이 구분을 모르면 결과가 배정 유형(일반고·학군지 일반고)에서 헛말을 한다.","source":"시·도 17곳 각각의 교육청 고등학교 입학전형 기본계획·신입생 배정 방안 원문 직독 (2026-08-26 조사 후 반박 검증 79건 반영). 시·도별 sourceUrl·sourceTitle 참조.","asOf":"2027학년도","policy":"confidence가 '확인'인 시·도만 화면에 낸다. 혼재 시·도에서 시·군·구가 목록 어디에도 없으면 아무 말도 하지 않는다. 모르는 걸 추측해서 배정 방식을 적지 않는다.","bySido":{"서울":{"system":"평준화","areas":["전 지역"],"nonAreas":[],"method":"서울 전역에서 2곳, 사는 학교군에서 2곳, 모두 4곳을 순서대로 씁니다. 성적은 안 보고 추첨으로 배정합니다.","schoolYear":"2027학년도","sourceUrl":"https://www.sen.go.kr/user/bbs/BD_selectBbs.do?q_bbsSn=1068&q_bbsDocNo=20260331091528935","directRead":true,"confidence":"확인"},"인천":{"system":"혼재","areas":["제물포구","미추홀구","부평구","계양구","남동구","연수구","서해구","검단구"],"nonAreas":["강화군","옹진군","영종구"],"method":"사는 학교군의 학교를 전부 순서대로 씁니다. 성적은 배정 대상에 드는지만 가르고, 어느 학교로 갈지는 지망 순서가 정합니다.","schoo const QI={}; QUESTIONS.questions.forEach(q=>QI[q.id]=q);
const TRACKS=QUESTIONS.tracks, TN={}; TRACKS.forEach(t=>TN[t.id]=t.name);
const FREQ=QUESTIONS.scales.freq5.labels;           // 거의 매번 … 전혀 없다

const pole=(id,v)=>{const o=(QI[id].options||[]).find(o=>o.value===v);return o?o.pole:null;};

function position(a){
  if(a.B1==='A'){
    const g=a.B2||{}, ks=Object.keys(g);
    if(ks.length===5&&ks.every(k=>g[k].raw!==''&&g[k].mean!=='')){
      const ds=ks.map(k=>+g[k].raw-+g[k].mean), raws=ks.map(k=>+g[k].raw);
      const d=ds.reduce((x,y)=>x+y,0)/5, mn=Math.min(...raws);
      for(const b of RULES.stage2.measured.bands)

    } return null;
  }
  const o=(QI.B3.options||[]).find(o=>o.value===a.B3);
  if(!o||o.noInfo) return null;
  const M=RULES.stage2.simple.map; let p=M[String(o.score)];
  if(p===undefined) return null;
  // 최상위 신호: 올 A + 3모 최상위면 상위 3%로 (점수만으론 최상위가 안 잡힌다)
  const ts=RULES.stage2.simple.topSignal, g=a.B5f;
  if(ts&&a.B3==='A'&&g){const vs=Object.values(g).map(Number).filter(x=>x>0);
    if(vs.length){const avg=vs.reduce((x,y)=>x+y,0)/vs.length; if(avg<=2) p=ts.pos;}}
  const lo=(QI.B4.options||[]).find(o=>o.value===a.B4);
  let pushed=false;
  if(lo&&!lo.noInfo){
    const order=QI.B3.options.filter(x=>!x.noInfo).map(x=>x.value);
    const gap=order.indexOf(a.B4)-order.indexOf(a.B3);
    if(gap>=2){ const vals=Object.values(M); const i=vals.indexOf(p);
      if(i>=0&&i<vals.length-1){p=vals[i+1];pushed=true;} }
  }
  return {pos:p,src:'simple',lowestPushed:pushed};
}
function signals(a){
  const S={};
  const rec=(lvl('F1',a.F1)+lvl('F2',a.F2))/2;
  S.recovery={v:rec,low:rec>0&&rec<=2};
  const hi=['D1','D2','D3'].filter(i=>fval(a[i])>=4).length;
  S.selfStandard={n:hi,high:hi>=2};
  const e1=fval(a.E1)>=4, e2=pole('E2',a.E2);
  S.competition={fuel:e1&&e2==='fuel',steady:e2==='steady'};
  let ef=null; const asked=a.C1!==undefined||a.C2!==undefined;
  const g=a.B5f, pp=position(a);
  if(g&&pp){const vs=Object.values(g).map(Number).filter(x=>x>0);
    if(vs.length){const avg=vs.reduce((x,y)=>x+y,0)/vs.length;
      if(pp.pos<=20&&avg>=3) ef='prepared'; if(pp.pos>50&&avg<=2) ef='unbounded';}}
  if(!ef&&asked){const p1=pole('C1',a.C1),p2=pole('C2',a.C2);
    ef=(p1==='prepared'||p2==='prepared')&&!(p1==='unbounded'&&p2==='unbounded')?'prepared':'unbounded';
    if(p1===p2) ef=p1||'prepared';}
  S.examFit={mode:ef,measured:!!(g&&pp),asked:asked};
  const gd=(pole('G1',a.G1)==='guided'&&pole('G2',a.G2)==='guided')||lvl('G3',a.G3)<=2;
  S.selfMgmt={guided:gd};
  S.peer={mode:pole('K3',a.K3)};
  return S;
}
function interest(a){
  const w={},acc=[];
  TRACKS.forEach(t=>{const v=a['K5-'+t.id]; w[t.id]=v?Number(v):0;});
  const vals=Object.values(w);
  const flat=vals.every(v=>v===vals[0])||!vals.some(v=>v>=3);
  if(!flat){const s=TRACKS.map(t=>t.id).sort((x,y)=>w[y]-w[x]);
    const top=w[s[0]];
    s.forEach(t=>{if(w[t]>=3&&acc.length<2&&(w[t]===top||acc.length===0||w[t]===w[s[0]]))acc.push(t);});
    if(!acc.length&&w[s[0]]>=3)acc.push(s[0]);
    if(acc.length<2&&w[s[1]]>=3&&w[s[1]]===w[s[0]])acc.push(s[1]);}
  return {w,acc,flat};
}

function equalizationOf(a){
  const EQ=RULES.equalization; if(!EQ||!EQ.bySido) return null;
  const reg=a.A2||{}, sido=reg.sido||'', sgg=(reg.sigungu||'').trim();
  const rec=EQ.bySido[sido];
  if(!rec||rec.confidence!=='확인') return null;
  if(rec.system!=='혼재') return Object.assign({},rec,{resolved:rec.system,place:sido});
  if(!sgg) return null;                       // 혼재인데 시·군·구를 모르면 단정하지 않는다
  const base=x=>String(x).replace(/\(.*/,'').split(/\s+/)[0];   // 청주시 동지역 → 청주시
  const qual=x=>String(x).slice(base(x).length).replace(/^[\s(]+/,'').replace(/[)\s]+$/,'').trim();
  // 정확히 같은 이름 → 앞부분이 같은 이름 → 시·군 이름이 같은 것 순으로 좁힌다
  const rules=[x=>x===sgg, x=>x.startsWith(sgg), x=>base(x)===base(sgg)];
  for(let i=0;i<rules.length;i++){
    const eq=(rec.areas||[]).filter(rules[i]), non=(rec.nonAreas||[]).filter(rules[i]);
    if(!eq.length&&!non.length) continue;
    if(eq.length&&non.length)                 // 한 시·군 안에서 갈린다 — 단정하지 않고 갈린다고 적는다
      return Object.assign({},rec,{resolved:'갈림',place:base(sgg),
        eqQ:eq.map(qual).filter(Boolean).join('·'), nonQ:non.map(qual).filter(Boolean).join('·')});
    const hit=eq.length?eq:non;
    return Object.assign({},rec,{resolved:eq.length?'평준화':'비평준화',
      place:hit.length===1?hit[0]:base(sgg)});
  }
  return null;                                // 어느 목록에도 없으면 말하지 않는다
}
function evaluate(a){
  const gid=a.A1, gf=RULES.gradeFrames[gid]||{};
  const T={}; RULES.types.forEach(t=>T[t.id]=t);
  // 관심 계열: 아이가 고른 것 우선, 없으면 흥미 결과
  const IT=interest(a);
  const stated=(a.K4||[]).filter(x=>x!=='none');
  const picks=stated.length?stated:IT.acc;
  const prep=a.H1;                      // A 준비중 / B 관심 / C 고려안함
  let hakgunjiResident=false;
  // ① 자격 심사 — 관심·준비가 안 맞는 유형은 후보에서 뺀다
  const elig={};
  RULES.types.forEach(t=>{
    let ok=true;
    if(t.requiresInterest) ok=t.requiresInterest.some(x=>picks.includes(x));
    if(t.requiresPrep) ok=ok&&(prep==='A'||prep==='B');
    elig[t.id]=ok;
  });
  const state={}; RULES.types.forEach(t=>{ if(elig[t.id]) state[t.id]={bucket:'primary',reasons:[]}; });
  const match=c=>Object.keys(c).every(k=>{const w=c[k],g=a[k];return Array.isArray(w)?w.includes(g):g===w;});
  // ② 현실 조건 (통학·기숙·비용)
  RULES.stage1.hard.forEach(r=>{ if(match(r.if)) r.limit.forEach(t=>{
    if(state[t]){state[t].bucket='low';state[t].reasons.push({kind:r.reason,text:r.text});}});});
  RULES.stage1.soft.forEach(r=>{ if(match(r.if)) r.flag.forEach(t=>{
    if(state[t]&&state[t].bucket==='primary'){state[t].bucket='conditional';state[t].reasons.push({kind:r.reason,text:r.text});}});});
  // ③ 학력 위치
  const P=gf.typeRanking?position(a):null;
  const inside={};
  const skipPos=RULES.stage2.skipTypesForPosition||[];
  if(P) RULES.types.forEach(t=>{
    if(!state[t.id]||state[t.id].bucket==='low') return;
    if(skipPos.includes(t.id)) return;   // 별도 전형: 내신 등급으로 판정 안 함

function sincerity(a,ms){
  const f=[];

  if(ms&&n>0&&ms/n<3000) f.push('pace');

  if(fr.length>=4&&new Set(fr).size===1&&it.length>=6&&new Set(it).size===1) f.push('straight');
  return f;
}

function eqLine(r){
  const E=r.equalization, T=RULES.equalization&&RULES.equalization.text;
  if(!E||!T) return '';
  const eun=n=>{const t=String(n||'').trim(), c=t.charCodeAt(t.length-1);
    return (c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28)?'은':'는';};
  const place=E.place==='전 지역'?((S.a.A2&&S.a.A2.sido)||''):(E.place||'');
  const fill=t=>String(t||'').replace(/\{place\}/g,place).replace(/\{eun\}/g,eun(place))
                  .replace(/\{method\}/g,E.method||'')
                  .replace(/\{eqQ\}/g,E.eqQ||'').replace(/\{eqEun\}/g,eun(E.eqQ))
                  .replace(/\{nonQ\}/g,E.nonQ||'').replace(/\{nonEun\}/g,eun(E.nonQ))
                  .replace(/\s+/g,' ').trim();
  if(E.resolved==='갈림')   return `<div class="bd">${esc(fill(T.split))}</div>`;
  if(E.resolved==='비평준화') return `<div class="bd">${esc(fill(T.nonEqualized))}</div>`;
  return `<div class="bd">${esc(fill(T.equalized))}</div>`
       + `<div class="bd">${esc(fill(T.equalizedTail))}</div>`;
}

function exSchools(typeId,reg,res,bucket){
  const SE=RULES.schoolExamples, E=SE&&SE.byType&&SE.byType[typeId];
  if(!E) return '';
  if(E.hideWhenLow&&bucket==='low') return '';
  const sido=(reg&&reg.sido)||'', sgg=(reg&&reg.sigungu)||'';
  const fill=t=>String(t||'').replace(/\{sido\}/g,sido||'사시는 지역').replace(/\{sigungu\}/g,sgg);
  if(E.scope==='district'){
    if(res) return `<div class="ex">${esc(fill(E.text))}</div>`;
    const HGx=RULES.hakgunji||{}, D=HGx.display||{};
    const names=Object.keys(D).map(k=>`${esc(k)}<span class="exr">${esc(D[k])}</span>`).join(' · ');
    return `<div class="ex"><span class="exl">${esc('저희가 잡은 학군지')}</span>${names}`
         + `<div class="exn">${esc(fill(E.textAway))}</div></div>`;
  }
  if(E.scope==='none') return `<div class="ex">${esc(fill(E.text))}</div>`;
  let list, label;
  if(E.scope==='national'){ list=E.list||[]; label='전국 '+list.length+'곳'; }
  else{
    list=(E.byRegion||{})[sido]||[];
    if(!list.length) return `<div class="ex">${esc(fill(E.noneText))}</div>`;
    label=(sido||'')+' '+list.length+'곳';
  }
  const names=list.map(x=>esc(x.n)+(x.r?`<span class="exr">${esc(x.r)}</span>`:'')).join(' · ');
  const notes=list.filter(x=>x.note).map(x=>esc(x.n)+' — '+esc(x.note)).join(' ');
  const ft=(E.footByRegion&&E.footByRegion[sido])||E.foot||'';
  const foot=[notes,ft?esc(ft):''].filter(Boolean).join(' ');
  return `<div class="ex"><span class="exl">${esc(label)}</span>${names}`
       + (foot?`<div class="exn">${foot}</div>`:'') + `</div>`;
}

  return '관심 있는 학교 두 곳의 편제표를 열어, 아이가 관심을 보인 분야의 과목이 실제로 개설되는지 확인해 보세요.';
}

/* PDF는 브라우저 인쇄창의 'PDF로 저장'으로 만든다.
   글꼴이 한글이라 파일을 직접 PDF로 찍으려면 폰트를 통째로 넣어야 해서 인쇄창을 쓴다.
   결과 화면의 @media print 규칙이 그대로 적용된다. */
async function doPrint(){
  const setMsg=t=>{const m=$('#prtmsg'); if(m) m.innerHTML=t;};
  const embedded=(()=>{try{return window.self!==window.top}catch(e){return true}})();
  let opened=false;
  try{ window.print(); opened=true; }catch(e){ opened=false; }
  setMsg(opened&&!embedded
    ? '인쇄 창에서 <b>대상</b>을 <b>PDF로 저장</b>으로 바꾸시면 PDF 파일이 됩니다.'
    : '인쇄 창이 뜨면 <b>대상</b>을 <b>PDF로 저장</b>으로 바꾸세요. 창이 안 뜨면 이 검사를 새 탭에서 연 뒤 브라우저 메뉴의 <b>인쇄</b>를 눌러 주세요.');
}

      reasons:Object.fromEntries(['primary','conditional','low'].flatMap(k=>r.buckets[k].map(b=>[b.id,b.reasons.map(x=>x.kind)]))),
      observations:r.obs.map(o=>o.text),interestAccepted:r.interest.acc,interestFlat:r.interest.flat,
      statedTracks:r.stated,gaps:r.gaps,branch:S.a.H1||null,typeRanking:!!r.frame.typeRanking}};
}

async function saveFile(name,txt,type){
  // 아티팩트 안에서는 downloads 능력을 통해야 파일이 내려간다
  try{
    if(window.claude&&typeof window.claude.use==='function'){
      const d=await window.claude.use('downloads');
      if(d&&typeof d.save==='function'){ await d.save({filename:name,data:txt}); return true; }
    }
  }catch(e){}
  try{
    const b=new Blob([txt],{type:type+';charset=utf-8'}),u=URL.createObjectURL(b);
    const a=document.createElement('a'); a.href=u; a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),1000); return true;
  }catch(e){ return false; }
}
function dl(txt,name,type){ saveFile(name,txt,type); }
